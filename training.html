<script>
const urlParams = new URLSearchParams(window.location.search);
const bookCode = urlParams.get('book') || "ess1";
const unitId = urlParams.get('unit') || "1";
const lessonKey = `${bookCode}_${unitId}`;

let currentLang = localStorage.getItem('selectedLang') || 'uz';
if(currentLang === 'en') currentLang = 'uz'; 

const db = (typeof lessonsDatabase !== 'undefined') ? lessonsDatabase : {};
const fallbackLesson = {
    "uz": { "title": "Dars topilmadi", "gamesTitle": "O'YINLAR RO'YXATI", "textHtml": "<p>Baza ulanmagan yoki dars topilmadi.</p>", "keywordsList": [] },
    "ru": { "title": "Урок не найден", "gamesTitle": "СПИСОК ИГР", "textHtml": "<p>База данных не найдена.</p>", "keywordsList": [] }
};
const lessonDataFull = db[lessonKey] || db["ess1_1"] || fallbackLesson;
let currentLessonData = lessonDataFull[currentLang] || lessonDataFull["uz"];

let localGameData = [];
let matchUpGroups = []; 

let currentGameIndex = 0;
let totalGameRounds = 0; 
let gameScore = 0;
let gameTimerInterval = null;
let gameSeconds = 0;
let roundSeconds = 0;
let roundTimerInterval = null;

window.onload = function() {
    document.getElementById("langSelect").value = currentLang;
    renderLessonContent();
    loadContent('text');
}

function toggleLessonLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('selectedLang', lang);
    currentLessonData = lessonDataFull[lang] || lessonDataFull["uz"];
    renderLessonContent();
    loadContent('text'); 
}

function renderLessonContent() {
    document.getElementById("lessonTitle").innerText = currentLessonData.title || "Mavzu";
    document.getElementById("gamesTitleText").innerText = currentLessonData.gamesTitle || "GAMELAR RO'YXATI";
}

// 🔊 Global Audio talaffuz funksiyasi (TTS)
function speakWord(word) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Navbatni tozalash
        let cleanText = word.replace(/[\[\]\(\)\.,\?!]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
    }
}

function playSoundEffect(isCorrect) {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (isCorrect) {
            let osc1 = ctx.createOscillator();
            let gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain1.gain.setValueAtTime(0.3, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start();
            osc1.stop(ctx.currentTime + 0.3);
        } else {
            let osc2 = ctx.createOscillator();
            let gain2 = ctx.createGain();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(120, ctx.currentTime);
            gain2.gain.setValueAtTime(0.2, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start();
            osc2.stop(ctx.currentTime + 0.25);
        }
    } catch (e) {}
}

function startWordwallTimer() {
    clearInterval(gameTimerInterval);
    clearInterval(roundTimerInterval);
    gameSeconds = 0;
    roundSeconds = 0;
    gameTimerInterval = setInterval(() => {
        gameSeconds++;
        const min = Math.floor(gameSeconds / 60);
        const sec = gameSeconds % 60;
        const timerEl = document.getElementById("wwTimer");
        if(timerEl) timerEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }, 1000);
    roundTimerInterval = setInterval(() => { roundSeconds++; }, 1000);
}

function calculateSpeedBonus() {
    let bonus = 20; 
    if (roundSeconds <= 7) bonus = 100;      
    else if (roundSeconds <= 15) bonus = 60; 
    roundSeconds = 0; 
    return bonus;
}

function updateWWStats() {
    const scoreEl = document.getElementById("wwScore");
    const progressEl = document.getElementById("wwProgressText");
    if(scoreEl) scoreEl.innerText = `✓ ${gameScore}`;
    if(progressEl) progressEl.innerText = `${currentGameIndex + 1} of ${totalGameRounds}`;
}

function checkGameOver(type, container) {
    if (currentGameIndex >= totalGameRounds) {
        clearInterval(gameTimerInterval);
        clearInterval(roundTimerInterval);
        const min = Math.floor(gameSeconds / 60);
        const sec = gameSeconds % 60;
        container.innerHTML = `
            <div class="ww-result-screen">
