<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars Mashg'uloti</title>
    <!-- FontAwesome Ikonkalar uchun -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Asosiy CSS faylingiz -->
    <link rel="stylesheet" href="training.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <div class="header-training">
        <a href="#" class="nav-icon-btn"><i class="fa-solid fa-house"></i></a>
        <div class="main-lesson-title">THE TWELVE MONTHS</div>
        <select class="lang-select-training">
            <option value="uz">O'Z</option>
            <option value="en">EN</option>
        </select>
        <a href="#" class="nav-icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
    </div>

    <!-- TOP MATERIALS BAR -->
    <div class="top-materials-bar">
        <button class="material-btn text-m-btn">
            <i class="fa-solid fa-file-lines"></i> Text
        </button>
        <button class="material-btn video-m-btn">
            <i class="fa-solid fa-play"></i> Video
        </button>
        <button class="material-btn keywords-m-btn">
            <i class="fa-solid fa-key"></i> Keywords
        </button>
        <button class="material-btn test-m-btn">
            <i class="fa-solid fa-square-check"></i> Test
        </button>
    </div>

    <!-- ASOSIY DISPLAY INTERFEYSI (O'YIN MAYDONI) -->
    <div class="main-layout">
        <div class="display-window">
            <button class="resize-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
            
            <!-- Statistikalar -->
            <div class="game-top-stats" style="padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                <span id="wwTime">0:00</span>
                <span><span id="wwScore">0</span> ❤️</span>
            </div>

            <!-- O'YIN CHIQADIGAN ASOSIY MAYDON -->
            <div id="wwPlayArea" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px;">
                <!-- Dastlabki yuklangandagi holat -->
                <p>O'yinni tanlang...</p>
            </div>

            <!-- PASTKI STATISTIKA -->
            <div style="text-align: center; padding: 8px; font-size: 14px; font-weight: bold; border-top: 1px solid #eee;" id="wwStats">
                1 of 20
            </div>
        </div>
    </div>

    <!-- AJRATUVCHI ZONE -->
    <div class="games-divider-zone">
        <span>GAMELAR RO'YXATI</span>
    </div>

    <!-- GAMELAR RO'YXATI PANELI -->
    <div class="games-grid">
        <button class="game-card-btn matchup-g-btn" onclick="startSelectedGame('matchup')">
            <i class="fa-solid fa-puzzle-piece game-icon"></i>
            <div class="game-info"><span>Match up</span> <i class="fa-solid fa-chevron-right"></i></div>
        </button>
        
        <button class="game-card-btn anagrama-g-btn" onclick="startSelectedGame('anagrama')">
            <i class="fa-solid fa-shuffle game-icon"></i>
            <div class="game-info"><span>Anagrama</span> <i class="fa-solid fa-chevron-right"></i></div>
        </button>
        
        <button class="game-card-btn typeanswer-g-btn" onclick="startSelectedGame('typeanswer')">
            <i class="fa-solid fa-keyboard game-icon"></i>
            <div class="game-info"><span>Type answer</span> <i class="fa-solid fa-chevron-right"></i></div>
        </button>
        
        <button class="game-card-btn flashcard-g-btn" onclick="startSelectedGame('flashcard')">
            <i class="fa-solid fa-clone game-icon"></i>
            <div class="game-info"><span>Flashcard</span> <i class="fa-solid fa-chevron-right"></i></div>
        </button>
    </div>

    <!-- SCRIPT (O'YIN LORIKASI VA FLASHCARD) -->
    <script>
        // Namunaviy so'zlar ro'yxati (Loyiha ma'lumotlaringiz bo'yicha)
        let localGameData = [
            { word: "anxious", translation: "xavotirlangan" },
            { word: "adventure", translation: "sarguzasht" },
            { word: "injured", translation: "jarohatlangan" },
            { word: "create", translation: "yaratmoq" },
            { word: "comprehend", translation: "tushunmoq" }
        ];

        let currentGameIndex = 0;
        let gameScore = 0;
        let totalGameRounds = 0;
        let flashcardList = [];
        let isShowingTranslation = false;

        // Ovozli talaffuz funksiyasi
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Ekran rejimini o'zgartirish
        function toggleFullscreen() {
            let dw = document.querySelector('.display-window');
            if (dw) dw.classList.toggle('fullscreen-active');
        }

        // O'yin tugash holati
        function checkGameOver(gameType, playArea) {
            if (currentGameIndex >= totalGameRounds) {
                playArea.innerHTML = `
                    <div style="text-align: center; padding: 30px 15px; background: #1a2332; color: white; border-radius: 18px; width: 100%; max-width: 340px;">
                        <h2 style="margin-bottom: 10px; color: #2ecc71;">O'yin Yakunlandi! 🎉</h2>
                        <p style="font-size: 18px; font-weight: bold; margin-bottom: 20px;">Natija: ${gameScore} / ${totalGameRounds}</p>
                        <button onclick="startSelectedGame('${gameType}')" style="background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;">
                            Qayta boshlash 🔄
                        </button>
                    </div>
                `;
                return true;
            }
            return false;
        }

        function updateWWStats() {
            const statsEl = document.getElementById("wwStats");
            if (statsEl) {
                statsEl.innerText = `${currentGameIndex + 1} of ${totalGameRounds}`;
            }
        }

        // O'yinlarni boshqaruvchi asosiy funksiya
        function startSelectedGame(gameType) {
            currentGameIndex = 0;
            gameScore = 0;

            const playArea = document.getElementById("wwPlayArea");
            if (!playArea) return;

            if (gameType === 'flashcard') {
                buildFlashcardGame();
            } else {
                playArea.innerHTML = `
                    <div style="text-align:center; padding: 40px; font-weight: bold; color: #555;">
                        <h3>${gameType.toUpperCase()} O'yini yuklanmoqda...</h3>
                    </div>
                `;
            }
        }

        // ==========================================
        // 2-RASMDAGI FLASHCARD TIZIMI
        // ==========================================
        function buildFlashcardGame() {
            const playArea = document.getElementById("wwPlayArea");
            if (!playArea) return;

            if (currentGameIndex === 0) {
                flashcardList = [...localGameData].sort(() => Math.random() - 0.5);
                totalGameRounds = flashcardList.length;
            }

            if (checkGameOver('flashcard', playArea)) return;

            let item = flashcardList[currentGameIndex];
            let escapedWord = item.word.replace(/'/g, "\\'");
            isShowingTranslation = false;

            // 2-rasmdagi ko'rinish va inglizcha tugmalar
            playArea.innerHTML = `
                <div class="fc-wrapper">
                    <!-- O'rtadagi Oq Karta va Sariq Badge -->
                    <div class="fc-main-card" id="flashcardBox" onclick="toggleFlashcardCard('${escapedWord}')">
                        <div class="fc-word-badge" id="fcWordContent">${item.word}</div>
                    </div>

                    <!-- Javob Berish Tugmalari -->
                    <div class="fc-action-buttons">
                        <button class="fc-btn fc-btn-know" onclick="handleFlashcardResult(true)">
                            <div class="fc-btn-top"><i class="fa-solid fa-check"></i> I know</div>
                            <div class="fc-btn-sub">(+1)</div>
                        </button>
                        <button class="fc-btn fc-btn-dontknow" onclick="handleFlashcardResult(false)">
                            <div class="fc-btn-top"><i class="fa-solid fa-xmark"></i> I don't know</div>
                            <div class="fc-btn-sub">(+1)</div>
                        </button>
                    </div>

                    <!-- Pastki Chap Tomondagi Qayta Eshitish Tugmasi -->
                    <div class="fc-listen-wrapper">
                        <button class="fc-listen-btn" onclick="speakWord('${escapedWord}')">
                            <i class="fa-solid fa-volume-high"></i> Listen again
                        </button>
                    </div>
                </div>
            `;

            updateWWStats();

            // Avto-talaffuz
            setTimeout(() => {
                speakWord(item.word);
            }, 250);
        }

        function toggleFlashcardCard(escapedWord) {
            let item = flashcardList[currentGameIndex];
            const wordEl = document.getElementById("fcWordContent");
            const cardEl = document.getElementById("flashcardBox");

            if (!isShowingTranslation) {
                wordEl.innerText = item.translation;
                cardEl.classList.add("translated");
                isShowingTranslation = true;
            } else {
                wordEl.innerText = item.word;
                cardEl.classList.remove("translated");
                isShowingTranslation = false;
                speakWord(item.word);
            }
        }

        function handleFlashcardResult(isCorrect) {
            if (isCorrect) {
                gameScore += 1;
            }
            currentGameIndex++;
            buildFlashcardGame();
        }

        // Dastlabki yuklanishda Flashcard o'yinini avtomatik ochish
        document.addEventListener("DOMContentLoaded", () => {
            startSelectedGame('flashcard');
        });
    </script>
</body>
</html>
