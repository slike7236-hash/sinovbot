<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars Mashg'uloti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="training.css">
    <script src="database.js"></script>
</head>
<body>

<div class="header-training">
    <a href="index.html" class="nav-icon-btn home-btn"><i class="fa-solid fa-house"></i></a>
    <div class="main-lesson-title" id="lessonTitle">Mavzu...</div>
    <div>
        <select class="lang-select-training" id="langSelect" onchange="toggleLessonLanguage(this.value)">
            <option value="uz">O'Z</option>
            <option value="ru">RU</option>
        </select>
    </div>
    <a href="javascript:history.back()" class="nav-icon-btn back-btn" title="Ortga qaytish">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
</div>

<div class="top-materials-bar">
    <button class="material-btn text-m-btn active" onclick="loadContent('text')">
        <i class="fa-solid fa-file-lines"></i> <span>Text</span>
    </button>
    <button class="material-btn video-m-btn" onclick="loadContent('video')">
        <i class="fa-solid fa-play"></i> <span>Video</span>
    </button>
    <button class="material-btn keywords-m-btn" onclick="loadContent('keywords')">
        <i class="fa-solid fa-key"></i> <span>Keywords</span>
    </button>
    <button class="material-btn test-m-btn" onclick="loadContent('test')">
        <i class="fa-solid fa-square-check"></i> <span>Test</span>
    </button>
</div>

<div class="main-layout">
    <div id="displayWindow" class="display-window">
        <button id="resizeBtn" class="resize-btn" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i>
        </button>

        <!-- Matn va testlar uchun -->
        <div id="textContainer" class="scrollable-text-content"></div>
        
        <!-- Video uchun -->
        <iframe id="iframeViewer" class="iframe-display" src="" allowfullscreen style="display:none; width:100%; height:100%; border:none;"></iframe>
        
        <!-- O'yinlar uchun -->
        <div id="wwPlayArea" style="display: none; width: 100%; height: 100%; overflow-y: auto;"></div>
    </div>
</div>
<div class="games-divider-zone" id="gamesDivider">
    <span id="gamesTitleText">GAMELAR RO'YXATI</span>
</div>

<!-- GAMELAR RO'YXATI PANELI -->
<div class="games-grid" id="gamesGrid">
    <button class="game-card-btn matchup-g-btn" onclick="startWWGame('matchup')">
        <span class="game-icon">🧩</span>
        <span class="game-info">Match up <i class="fa-solid fa-chevron-right"></i></span>
    </button>
    <button class="game-card-btn anagrama-g-btn" onclick="startWWGame('anagram')">
        <span class="game-icon">🔤</span>
        <span class="game-info">Anagrama <i class="fa-solid fa-chevron-right"></i></span>
    </button>
    <button class="game-card-btn typeanswer-g-btn" onclick="startWWGame('typeanswer')">
        <span class="game-icon">⌨️</span>
        <span class="game-info">Type answer <i class="fa-solid fa-chevron-right"></i></span>
    </button>
    <button class="game-card-btn pair-g-btn" onclick="startWWGame('flashcard')">
        <span class="game-icon">🎴</span>
        <span class="game-info">Flashcard <i class="fa-solid fa-chevron-right"></i></span>
    </button>
</div>
<script>
    // Promise.withResolvers funksiyasi mavjud bo'lmagan brauzerlar uchun Polyfill
if (typeof Promise.withResolvers !== 'function') {
    Promise.withResolvers = function () {
        let resolve, reject;
        const promise = new Promise((res, rej) => {
            resolve = res;
            reject = rej;
        });
        return { promise, resolve, reject };
    };
}
// ==========================================
// GLOBUS O'ZGARUVCHILAR
// ==========================================
let userName = "";
let currentGameType = "";
let currentGameIndex = 0;
let totalGameRounds = 0;
let gameScore = 0;
let gameTimer = null;
let timerSeconds = 0;
let gameAnswersLog = []; 

let selectedMatchWord = null;
let selectedMatchTrans = null;

// Zaxira uchun namuna lug'at (agar localGameData bo'sh bo'lsa ishlatiladi)
const fallbackGameData = [
    { word: "Environment", translation: "Atrof-muhit" },
    { word: "Pollution", translation: "Ifloslanish" },
    { word: "Protect", translation: "Himoya qilmoq" },
    { word: "Recycle", translation: "Qayta ishlamoq" },
    { word: "Nature", translation: "Tabiat" }
];

// ==========================================
// 1. TEPADAGI MATERIAL TUGMALARI (Text, Video, Keywords, Test)
// ==========================================
function loadContent(contentType) {
    clearIntervalTimer();
    
    const textCont = document.getElementById("textContainer");
    const iframeViewer = document.getElementById("iframeViewer");
    const gameArea = document.getElementById("wwPlayArea");

    if (gameArea) gameArea.style.display = "none";

    document.querySelectorAll(".material-btn").forEach(btn => btn.classList.remove("active"));
    
    if (contentType === 'text') {
        if (textCont) textCont.style.display = "block";
        if (iframeViewer) {
            iframeViewer.style.display = "none";
            iframeViewer.src = ""; // Videoni to'xtatish
        }
        document.querySelector(".text-m-btn")?.classList.add("active");
        if (textCont) textCont.innerHTML = "<h2>Dars matni</h2><p>Bu yerda dars matni joylashadi...</p>";
    } 
    else if (contentType === 'video') {
        if (textCont) textCont.style.display = "none";
        if (iframeViewer) {
            iframeViewer.style.display = "block";
            // Xatoliklarni kamaytirish uchun havola parametrlari sozlandi
            iframeViewer.src = "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?enablejsapi=1&rel=0";
        }
        document.querySelector(".video-m-btn")?.classList.add("active");
    } 
    else if (contentType === 'keywords') {
        if (textCont) textCont.style.display = "block";
        if (iframeViewer) {
            iframeViewer.style.display = "none";
            iframeViewer.src = "";
        }
        document.querySelector(".keywords-m-btn")?.classList.add("active");
        
        let wordsList = (typeof localGameData !== 'undefined' && localGameData && localGameData.length > 0) ? localGameData : fallbackGameData;
        let html = "<h2>Kalit so'zlar</h2><ul>";
        wordsList.forEach(item => {
            html += `<li><b>${item.word}</b> - ${item.translation}</li>`;
        });
        html += "</ul>";
        if (textCont) textCont.innerHTML = html;
    } 
    else if (contentType === 'test') {
        if (textCont) textCont.style.display = "block";
        if (iframeViewer) {
            iframeViewer.style.display = "none";
            iframeViewer.src = "";
        }
        document.querySelector(".test-m-btn")?.classList.add("active");
        if (textCont) textCont.innerHTML = "<h2>Mavzu yuzasidan testlar</h2><p>Test savollari yuklanmoqda...</p>";
    }
}
// ==========================================
// 2. O'YINNI BOSH LASH VA START TUGMASI
// ==========================================
function startWWGame(gameType) {
    currentGameType = gameType;

    // Matn va videolarni yashiramiz
    const textCont = document.getElementById("textContainer");
    const iframeViewer = document.getElementById("iframeViewer");
    if (textCont) textCont.style.display = "none";
    if (iframeViewer) iframeViewer.style.display = "none";

    // O'yin konteynerini olamiz
    let gameContainer = document.getElementById("wwPlayArea");
    if (!gameContainer) {
        const displayWin = document.getElementById("displayWindow");
        gameContainer = document.createElement("div");
        gameContainer.id = "wwPlayArea";
        if (displayWin) displayWin.appendChild(gameContainer);
    }
    gameContainer.style.display = "block";
    gameContainer.style.width = "100%";
    gameContainer.style.height = "100%";
    gameContainer.style.overflowY = "auto";

    // Ism kiritish oynasi
    gameContainer.innerHTML = `
        <div class="ww-start-screen" style="padding: 30px 10px; text-align: center;">
            <div class="ww-start-title" style="font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #2c3e50;">O'yinni boshlash</div>
            <p style="font-size:14px; color:#666; margin-bottom: 15px;">Ism va familiyangizni kiriting:</p>
            <input type="text" id="wwUserNameInput" class="ww-name-input" placeholder="Ism Familiya" value="${userName}" style="padding: 10px 15px; width: 80%; max-width: 280px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; outline: none;">
            <br>
            <button class="ww-start-btn" onclick="confirmStartGame()" style="padding: 10px 25px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">START <i class="fa-solid fa-play"></i></button>
        </div>
    `;
}

function confirmStartGame() {
    const input = document.getElementById("wwUserNameInput");
    userName = (input && input.value.trim() !== "") ? input.value.trim() : "Mehmon";

    currentGameIndex = 0;
    gameScore = 0;
    gameAnswersLog = [];

    // Lug'at ma'lumotlarini tekshirish
    if (typeof localGameData === 'undefined' || !localGameData || localGameData.length === 0) {
        window.activeDataset = fallbackGameData;
    } else {
        window.activeDataset = localGameData;
    }

    totalGameRounds = window.activeDataset.length;

    // O'yin turini ishga tushirish
    if (currentGameType === 'flashcard') buildFlashcardGame();
    else if (currentGameType === 'matchup') buildMatchUpGame();
    else if (currentGameType === 'typeanswer' || currentGameType === 'anagram') buildTypeAnswerGame();
}

// ==========================================
// 3. TAYMER VA HISOBLASH
// ==========================================
function clearIntervalTimer() {
    if (gameTimer) {
        clearInterval(gameTimer);
        gameTimer = null;
    }
}

function startCountdown(seconds, onTimeout) {
    clearIntervalTimer();
    timerSeconds = seconds;
    updateTimerDisplay();

    gameTimer = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds <= 0) {
            clearIntervalTimer();
            if (typeof onTimeout === 'function') onTimeout();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const el = document.getElementById("wwTimerDisplay");
    if (el) el.innerText = `${timerSeconds}s`;
}

function renderTopBarHtml(title, showTimer = true) {
    return `
        <div class="ww-game-top-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ddd; margin-bottom: 15px;">
            <span style="font-weight: bold;">${title} (${currentGameIndex + 1}/${totalGameRounds})</span>
            ${showTimer ? `<div class="ww-timer-badge" style="background: #e74c3c; color: #fff; padding: 4px 10px; border-radius: 12px; font-weight: bold;"><i class="fa-solid fa-clock"></i> <span id="wwTimerDisplay">${timerSeconds}s</span></div>` : ''}
            <button class="ww-finish-btn" onclick="finishWWGame()" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">FINISH</button>
        </div>
    `;
}

// ==========================================
// 4. FLASHCARD O'YINI
// ==========================================
function buildFlashcardGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    if (currentGameIndex >= totalGameRounds) {
        showFinalResult();
        return;
    }

    let item = window.activeDataset[currentGameIndex];
    let escapedWord = item.word.replace(/'/g, "\\'");

    playArea.innerHTML = `
        ${renderTopBarHtml('Flashcard', true)}
        <div class="ww-fc-card" style="text-align: center; padding: 20px;">
            <div class="ww-fc-word-container" style="font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #2c3e50;">
                <span class="ww-fc-word-text" id="fcWordText">${item.word}</span>
                <button class="ww-fc-speaker-inline-btn" id="fcSpeakerBtn" onclick="speakWord('${escapedWord}')" style="background: none; border: none; color: #3498db; font-size: 20px; cursor: pointer; margin-left: 10px;">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
                        
            <div class="ww-fc-footer-bar" style="display: flex; justify-content: space-around; align-items: center;">
                <button class="ww-fc-nav-btn" onclick="navWWGame(-1)" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; cursor:pointer;"><i class="fa-solid fa-backward-step"></i></button>
                                
                <div class="ww-fc-center-action">
                    <div id="fcOpenZone">
                        <button class="ww-fc-open-btn" onclick="revealFlashcardTranslation()" style="padding: 10px 25px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">OPEN</button>
                    </div>
                                        
                    <div id="fcActionZone" style="display:none; gap: 15px;">
                        <button onclick="handleFlashcardResult(false)" style="padding: 10px 20px; background: #e74c3c; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
                        <button onclick="handleFlashcardResult(true)" style="padding: 10px 20px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;"><i class="fa-solid fa-check"></i></button>
                    </div>
                </div>

                <button class="ww-fc-nav-btn" onclick="navWWGame(1)" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; cursor:pointer;"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
    `;

    speakWord(item.word);

    startCountdown(15, () => {
        logAnswer(item.word, item.translation, "Vaqt tugadi", 'skipped');
        currentGameIndex++;
        buildFlashcardGame();
    });
}

function revealFlashcardTranslation() {
    let item = window.activeDataset[currentGameIndex];
    document.getElementById("fcWordText").innerText = item.translation;
    const speakerBtn = document.getElementById("fcSpeakerBtn");
    if (speakerBtn) speakerBtn.style.display = "none";

    document.getElementById("fcOpenZone").style.display = "none";
    document.getElementById("fcActionZone").style.display = "flex";
}

function handleFlashcardResult(isCorrect) {
    clearIntervalTimer();
    let item = window.activeDataset[currentGameIndex];

    if (isCorrect) {
        gameScore += 1;
        logAnswer(item.word, item.translation, "To'g'ri bildi", 'correct');
    } else {
        logAnswer(item.word, item.translation, "Xato bildi", 'incorrect');
    }
    
    currentGameIndex++;
    buildFlashcardGame();
}

function navWWGame(dir) {
    clearIntervalTimer();
    currentGameIndex += dir;
    if (currentGameIndex < 0) currentGameIndex = 0;
    buildFlashcardGame();
}

// ==========================================
// 5. MATCH UP O'YINI
// ==========================================
function buildMatchUpGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    let dataset = window.activeDataset;
    let wordsArr = [...dataset].map(item => item.word).sort(() => Math.random() - 0.5);
    let transArr = [...dataset].map(item => item.translation).sort(() => Math.random() - 0.5);

    playArea.innerHTML = `
        ${renderTopBarHtml('Match Up', false)}
        <div style="padding:10px;">
            <div style="text-align:center; font-weight:bold; margin-bottom:15px;">So'zlarni tarjimasi bilan moslang</div>
            <div style="display: flex; justify-content: space-between; gap: 10px;">
                <div id="matchWordsCol" style="flex:1; display:flex; flex-direction:column; gap:8px;"></div>
                <div id="matchTransCol" style="flex:1; display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>
    `;

    const wordsCol = document.getElementById("matchWordsCol");
    const transCol = document.getElementById("matchTransCol");

    wordsArr.forEach(word => {
        let div = document.createElement("div");
        div.className = "ww-match-item";
        div.innerText = word;
        div.style.cssText = "padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; cursor: pointer; background: #fff;";
        div.setAttribute("data-word", word);
        div.onclick = () => {
            if (div.classList.contains('matched')) return;
            document.querySelectorAll("#matchWordsCol .ww-match-item").forEach(el => { if(!el.classList.contains('matched')) el.style.background = "#fff"; });
            div.style.background = "#e0f7fa";
            selectedMatchWord = div;
            checkMatchPair();
        };
        wordsCol.appendChild(div);
    });

    transArr.forEach(trans => {
        let div = document.createElement("div");
        div.className = "ww-match-item";
        div.innerText = trans;
        div.style.cssText = "padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; cursor: pointer; background: #fff;";
        div.setAttribute("data-trans", trans);
        div.onclick = () => {
            if (div.classList.contains('matched')) return;
            document.querySelectorAll("#matchTransCol .ww-match-item").forEach(el => { if(!el.classList.contains('matched')) el.style.background = "#fff"; });
            div.style.background = "#e0f7fa";
            selectedMatchTrans = div;
            checkMatchPair();
        };
        transCol.appendChild(div);
    });
}

function checkMatchPair() {
    if (!selectedMatchWord || !selectedMatchTrans) return;

    let wordVal = selectedMatchWord.getAttribute("data-word");
    let transVal = selectedMatchTrans.getAttribute("data-trans");

    let matchFound = window.activeDataset.some(item => item.word === wordVal && item.translation === transVal);

    if (matchFound) {
        speakWord(wordVal);
        selectedMatchWord.style.background = "#2ecc71";
        selectedMatchWord.style.color = "#fff";
        selectedMatchTrans.style.background = "#2ecc71";
        selectedMatchTrans.style.color = "#fff";
        
        selectedMatchWord.classList.add('matched');
        selectedMatchTrans.classList.add('matched');

        logAnswer(wordVal, transVal, transVal, 'correct');

        selectedMatchWord = null;
        selectedMatchTrans = null;

        const totalItems = document.querySelectorAll(".ww-match-item").length;
        const matchedItems = document.querySelectorAll(".ww-match-item.matched").length;

        if (totalItems === matchedItems) {
            setTimeout(() => { showFinalResult(); }, 1000);
        }
    } else {
        let wBtn = selectedMatchWord;
        let tBtn = selectedMatchTrans;
        wBtn.style.background = "#e74c3c";
        tBtn.style.background = "#e74c3c";
        wBtn.style.color = "#fff";
        tBtn.style.color = "#fff";
                
        setTimeout(() => {
            wBtn.style.background = "#fff";
            tBtn.style.background = "#fff";
            wBtn.style.color = "#000";
            tBtn.style.color = "#000";
        }, 800);

        logAnswer(wordVal, transVal, "Xato juftlik", 'incorrect');

        selectedMatchWord = null;
        selectedMatchTrans = null;
    }
}

// ==========================================
// 6. TYPE ANSWER O'YINI
// ==========================================
function buildTypeAnswerGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    if (currentGameIndex >= totalGameRounds) {
        showFinalResult();
        return;
    }

    let item = window.activeDataset[currentGameIndex];

    playArea.innerHTML = `
        ${renderTopBarHtml('Type Answer', true)}
        <div style="text-align:center; padding:20px;">
            <div style="font-size:18px; font-weight:bold; color:#2c3e50; margin-bottom:15px;">${item.translation}</div>
            <input type="text" id="wwTypeInput" placeholder="So'zni yozing..." autocomplete="off" style="padding:10px; border-radius:6px; border:1px solid #ccc; width:80%; max-width:250px; margin-bottom:15px; outline:none;">
            <br>
            <button onclick="submitTypeAnswer()" style="padding:8px 20px; background:#27ae60; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Tekshirish</button>
        </div>
    `;

    startCountdown(45, () => {
        logAnswer(item.word, item.translation, "Vaqt tugadi", 'skipped');
        currentGameIndex++;
        buildTypeAnswerGame();
    });
}

function submitTypeAnswer() {
    clearIntervalTimer();
    let input = document.getElementById("wwTypeInput");
    let userVal = input ? input.value.trim().toLowerCase() : "";
    let item = window.activeDataset[currentGameIndex];

    if (userVal === item.word.toLowerCase()) {
        gameScore += 1;
        logAnswer(item.word, item.translation, userVal, 'correct');
    } else {
        logAnswer(item.word, item.translation, userVal || "Javobsiz", 'incorrect');
    }

    currentGameIndex++;
    buildTypeAnswerGame();
}

// ==========================================
// 7. NATIJA VA FINISH
// ==========================================
function logAnswer(word, translation, userAns, status) {
    gameAnswersLog.push({ word, translation, userAns, status });
}

function finishWWGame() {
    clearIntervalTimer();
    showFinalResult();
}

function showFinalResult() {
    clearIntervalTimer();
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    let correctCount = gameAnswersLog.filter(a => a.status === 'correct').length;
    let incorrectCount = gameAnswersLog.filter(a => a.status === 'incorrect').length;
    let skippedCount = gameAnswersLog.filter(a => a.status === 'skipped').length;
    let totalAsked = gameAnswersLog.length || 1;

    let percentage = Math.round((correctCount / totalAsked) * 100);

    playArea.innerHTML = `
        <div style="text-align:center; padding:20px;">
            <div style="font-size:18px; font-weight:bold;">Natija: ${userName}</div>
            
            <div style="width:90px; height:90px; border-radius:50%; background:#27ae60; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; margin:15px auto;">
                <span style="font-size:22px; font-weight:bold;">${percentage}%</span>
                <span style="font-size:10px;">O'zlashtirish</span>
            </div>

            <div style="display:flex; justify-content:space-around; margin-bottom:15px; font-weight:bold;">
                <div style="color:#27ae60;">To'g'ri: ${correctCount}</div>
                <div style="color:#e74c3c;">Xato: ${incorrectCount}</div>
                <div style="color:#f39c12;">O'tkazildi: ${skippedCount}</div>
            </div>

            <button onclick="toggleDetailsTable()" style="padding:8px 15px; background:#3498db; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-bottom:10px;">
                <i class="fa-solid fa-list-check"></i> Batafsil
            </button>

            <div id="wwDetailsBox" style="display:none; width:100%; max-height:180px; overflow-y:auto; border:1px solid #ddd; border-radius:6px; margin-bottom:10px;">
                <table style="width:100%; font-size:12px; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f2f2f2;">
                            <th style="padding:6px; border:1px solid #ddd;">So'z</th>
                            <th style="padding:6px; border:1px solid #ddd;">Javobingiz</th>
                            <th style="padding:6px; border:1px solid #ddd;">Holat</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${gameAnswersLog.map(item => `
                            <tr>
                                <td style="padding:6px; border:1px solid #ddd;"><b>${item.word}</b> (${item.translation})</td>
                                <td style="padding:6px; border:1px solid #ddd;">${item.userAns}</td>
                                <td style="padding:6px; border:1px solid #ddd; color:${item.status === 'correct' ? '#27ae60' : item.status === 'incorrect' ? '#e74c3c' : '#f39c12'}; font-weight:bold;">
                                    ${item.status === 'correct' ? 'To\'g\'ri' : item.status === 'incorrect' ? 'Xato' : 'Vaqt yetmadi'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>

            <br>
            <button onclick="startWWGame('${currentGameType}')" style="padding:10px 20px; background:#27ae60; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">
                <i class="fa-solid fa-rotate-right"></i> Qaytadan boshlash
            </button>
        </div>
    `;
}

function toggleDetailsTable() {
    const box = document.getElementById("wwDetailsBox");
    if (box) {
        box.style.display = box.style.display === "none" ? "block" : "none";
    }
}

function speakWord(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    loadContent('text');
});
