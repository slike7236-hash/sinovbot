<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars Mashg'uloti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="training.css">
    <script src="database.js"></script>
</head>
<body>

<div class="header-training">
    <a href="index.html" class="nav-icon-btn home-btn"><i class="fa-solid fa-house"></i></a>
    <div class="main-lesson-title" id="lessonTitle">Mavzu...</div>
    <div>
        <select class="lang-select-training" id="langSelect" onchange="toggleLessonLanguage(this.value)">
            <option value="uz">O'Z</option>
            <option value="ru">RU</option>
        </select>
    </div>
    <a href="javascript:history.back()" class="nav-icon-btn back-btn" title="Ortga qaytish">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
</div>

<div class="top-materials-bar">
    <button class="material-btn text-m-btn active" onclick="loadContent('text')">
        <i class="fa-solid fa-file-lines"></i> <span>Text</span>
    </button>
    <button class="material-btn video-m-btn" onclick="loadContent('video')">
        <i class="fa-solid fa-play"></i> <span>Video</span>
    </button>
    <button class="material-btn keywords-m-btn" onclick="loadContent('keywords')">
        <i class="fa-solid fa-key"></i> <span>Keywords</span>
    </button>
    <button class="material-btn test-m-btn" onclick="loadContent('test')">
        <i class="fa-solid fa-square-check"></i> <span>Test</span>
    </button>
</div>

<div class="main-layout">
    <div id="displayWindow" class="display-window">
        <button id="resizeBtn" class="resize-btn" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i>
        </button>

        <div id="textContainer" class="scrollable-text-content"></div>
        <iframe id="iframeViewer" class="iframe-display" src="" allowfullscreen></iframe>
    </div>
</div>

<div class="games-divider-zone" id="gamesDivider">
    <span id="gamesTitleText">GAMELAR RO'YXATI</span>
</div>

<div class="games-grid" id="gamesGrid">
    <button class="game-card-btn matchup-g-btn" onclick="loadContent('matchup')">
        <div class="game-icon"><i class="fa-solid fa-puzzle-piece"></i></div>
        <div class="game-info">Match up <i class="fa-solid fa-angle-right"></i></div>
    </button>        
    <button class="game-card-btn anagrama-g-btn" onclick="loadContent('anagrama')">
        <div class="game-icon"><i class="fa-solid fa-shuffle"></i></div>
        <div class="game-info">Anagrama <i class="fa-solid fa-angle-right"></i></div>
    </button>        
    <button class="game-card-btn typeanswer-g-btn" onclick="loadContent('typeanswer')">
        <div class="game-icon"><i class="fa-solid fa-keyboard"></i></div>
        <div class="game-info">Type answer <i class="fa-solid fa-angle-right"></i></div>
    </button>
    <button class="game-card-btn flashcard-g-btn" onclick="loadContent('flashcard')">
        <div class="game-icon"><i class="fa-solid fa-clone"></i></div>
        <div class="game-info">Flashcard <i class="fa-solid fa-angle-right"></i></div>
    </button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const bookCode = urlParams.get('book') || "ess1";
const unitId = urlParams.get('unit') || "1";
const lessonKey = `${bookCode}_${unitId}`;

let currentLang = localStorage.getItem('selectedLang') || 'uz';
if(currentLang === 'en') currentLang = 'uz'; 

const db = (typeof lessonsDatabase !== 'undefined') ? lessonsDatabase : {};
const fallbackLesson = {    
    "uz": { 
        "title": "Dars topilmadi", 
        "gamesTitle": "O'YINLAR RO'YXATI", 
        "textHtml": "<p>Baza ulanmagan yoki dars topilmadi.</p>", 
        "keywordsList": [
            { "word": "injured", "translation": "jarohatlangan" },
            { "word": "apple", "translation": "olma" },
            { "word": "book", "translation": "kitob" }
        ] 
    }
};

const lessonDataFull = db[lessonKey] || fallbackLesson;
let currentLessonData = lessonDataFull[currentLang] || lessonDataFull["uz"];
let localGameData = [];

// Har bir game uchun ALOHIDA statistika
let gameStats = {
    correct: 0,
    incorrect: 0,
    currentIndex: 0,
    totalRounds: 0
};

let fcCountdownInterval = null;
let fcTimeRemaining = 15;

function speakWord(word) {
    if (!word) return;
    let cleanText = word.replace(/[\[\]\(\)\.,\?!;:"']/g, '').trim();
    if (!cleanText) return;

    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

function loadContent(type) {
    const textZone = document.getElementById("textContainer");
    const iframeZone = document.getElementById("iframeViewer");

    clearInterval(fcCountdownInterval);

    document.querySelectorAll(".material-btn, .game-card-btn").forEach(btn => btn.classList.remove("active"));
    let targetBtn = document.querySelector("." + type + "-m-btn") || document.querySelector("." + type + "-g-btn");
    if(targetBtn) targetBtn.classList.add("active");

    textZone.style.display = "none";
    iframeZone.style.display = "none";
    iframeZone.src = "";

    localGameData = currentLessonData.keywordsList || [];

    if (type === 'flashcard') {
        textZone.style.display = "block";
        
        // Flashcard statistikalarini nolga tushirish
        gameStats.correct = 0;
        gameStats.incorrect = 0;
        gameStats.currentIndex = 0;
        gameStats.totalRounds = localGameData.length;

        textZone.innerHTML = `            
            <div class="ww-game-container">                
                <div class="ww-top-bar">                    
                    <span>Score: <b style="color:#22c55e;" id="fcCorrectCount">✓ 0</b> | <b style="color:#ef4444;" id="fcIncorrectCount">✗ 0</b></span>                    
                    <span class="fc-timer-badge"><i class="fa-solid fa-clock"></i> <span id="fcTimer">15</span>s</span>                
                </div>                
                <div class="ww-play-area" id="wwPlayArea"></div>                
                <div class="ww-bottom-bar">                    
                    <button class="ww-nav-btn" onclick="navFlashcard(-1)"><i class="fa-solid fa-backward-step"></i></button>                    
                    <span id="fcProgressText" style="font-weight:bold;">1 of ${gameStats.totalRounds}</span>                    
                    <button class="ww-nav-btn" onclick="navFlashcard(1)"><i class="fa-solid fa-forward-step"></i></button>                
                </div>            
            </div>`;

        renderFlashcardCard();
    }
}

// 🎴 FLASHCARD O'YINI MANTIQLARI
function renderFlashcardCard() {
    clearInterval(fcCountdownInterval);
    
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    if (gameStats.currentIndex >= gameStats.totalRounds) {
        // Yakuniy hisob paneli
        playArea.innerHTML = `
            <div style="text-align:center; padding:20px;">
                <i class="fa-solid fa-trophy" style="font-size:50px; color:#f59e0b; margin-bottom:15px;"></i>
                <h2>Flashcard Finished!</h2>
                <p style="font-size:18px; margin:15px 0;">Correct answers: <b style="color:#22c55e;">${gameStats.correct}</b></p>
                <p style="font-size:18px; margin-bottom:20px;">Incorrect answers: <b style="color:#ef4444;">${gameStats.incorrect}</b></p>
                <button class="fc-btn-replay" onclick="loadContent('flashcard')"><i class="fa-solid fa-rotate-right"></i> Play Again</button>
            </div>`;
        return;
    }

    let currentItem = localGameData[gameStats.currentIndex];

    // Card strukturasi (Aynan rasmdagidek)
    playArea.innerHTML = `
        <div class="fc-card-box">
            <div class="fc-word-highlight">${currentItem.word}</div>
        </div>

        <div class="fc-buttons-grid">
            <button class="fc-btn-know" onclick="handleFCAnswer(true)">
                <span>✓ Know</span>
                <span style="font-size:12px; opacity:0.8;">(+1)</span>
            </button>
            <button class="fc-btn-dontknow" onclick="handleFCAnswer(false)">
                <span>✕ Don't know</span>
                <span style="font-size:12px; opacity:0.8;">(+1)</span>
            </button>
        </div>

        <button class="fc-btn-replay" onclick="speakWord('${currentItem.word}')">
            <i class="fa-solid fa-volume-high"></i> Replay audio
        </button>
    `;

    // Statistikani yangilash
    document.getElementById("fcCorrectCount").innerText = `✓ ${gameStats.correct}`;
    document.getElementById("fcIncorrectCount").innerText = `✗ ${gameStats.incorrect}`;
    document.getElementById("fcProgressText").innerText = `${gameStats.currentIndex + 1} of ${gameStats.totalRounds}`;

    // Avto-talaffuz qilish
    speakWord(currentItem.word);

    // 15 soniyalik taymerni ishga tushirish
    startFCTimer();
}

function startFCTimer() {
    fcTimeRemaining = 15;
    const timerDisplay = document.getElementById("fcTimer");
    if (timerDisplay) timerDisplay.innerText = fcTimeRemaining;

    fcCountdownInterval = setInterval(() => {
        fcTimeRemaining--;
        if (timerDisplay) timerDisplay.innerText = fcTimeRemaining;

        if (fcTimeRemaining <= 0) {
            clearInterval(fcCountdownInterval);
            // Vaqt tugagach noto'g'ri hisoblab keyingisiga o'tadi
            handleFCAnswer(false);
        }
    }, 1000);
}

function handleFCAnswer(isCorrect) {
    clearInterval(fcCountdownInterval);

    if (isCorrect) {
        gameStats.correct++;
    } else {
        gameStats.incorrect++;
    }

    gameStats.currentIndex++;
    renderFlashcardCard();
}

function navFlashcard(direction) {
    clearInterval(fcCountdownInterval);
    gameStats.currentIndex += direction;

    if (gameStats.currentIndex < 0) gameStats.currentIndex = 0;
    renderFlashcardCard();
}
</script>
</body>
</html>
