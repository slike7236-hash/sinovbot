<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars Mashg'uloti</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="training.css">
    <script src="database.js"></script>
</head>
<body>

<div class="header-training">
    <a href="index.html" class="nav-icon-btn home-btn"><i class="fa-solid fa-house"></i></a>
    <div class="main-lesson-title" id="lessonTitle">Mavzu...</div>
    <div>
        <select class="lang-select-training" id="langSelect" onchange="toggleLessonLanguage(this.value)">
            <option value="uz">O'Z</option>
            <option value="ru">RU</option>
        </select>
    </div>
    <a href="javascript:history.back()" class="nav-icon-btn back-btn" title="Ortga qaytish">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
</div>

<div class="top-materials-bar">
    <button class="material-btn text-m-btn active" onclick="loadContent('text')">
        <i class="fa-solid fa-file-lines"></i> <span>Text</span>
    </button>
    <button class="material-btn video-m-btn" onclick="loadContent('video')">
        <i class="fa-solid fa-play"></i> <span>Video</span>
    </button>
    <button class="material-btn keywords-m-btn" onclick="loadContent('keywords')">
        <i class="fa-solid fa-key"></i> <span>Keywords</span>
    </button>
    <button class="material-btn test-m-btn" onclick="loadContent('test')">
        <i class="fa-solid fa-square-check"></i> <span>Test</span>
    </button>
</div>

<div class="main-layout">
    <div id="displayWindow" class="display-window" style="position: relative;">
        <button id="resizeBtn" class="resize-btn" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i>
        </button>

        <div id="floatingAudioPlayer" class="floating-audio-player" style="display: none;">
            <button onclick="rewindAudio(-10)" title="10 soniya ortga"><i class="fa-solid fa-backward"></i></button>
            <button id="playerPlayBtn" onclick="toggleAudioPlay()" class="play-main-btn" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
            <button onclick="rewindAudio(10)" title="10 soniya oldinga"><i class="fa-solid fa-forward"></i></button>
            <select id="audioSpeedSelect" onchange="changeAudioSpeed(this.value)" title="Tezlik">
                <option value="1">1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
            </select>
            <audio id="mainAudioElement"></audio>
        </div>

        <div id="textContainer" class="scrollable-text-content"></div>
        <iframe id="iframeViewer" class="iframe-display" src="" allowfullscreen></iframe>
    </div>
</div>

<div class="games-divider-zone" id="gamesDivider">
    <span id="gamesTitleText">GAMELAR RO'YXATI</span>
</div>

<div class="games-grid" id="gamesGrid">
    <button class="game-card-btn matchup-g-btn" onclick="loadContent('matchup')">
        <div class="game-icon"><i class="fa-solid fa-puzzle-piece"></i></div>
        <div class="game-info">Match up <i class="fa-solid fa-angle-right"></i></div>
    </button>
    
    <button class="game-card-btn anagrama-g-btn" onclick="loadContent('anagrama')">
        <div class="game-icon"><i class="fa-solid fa-shuffle"></i></div>
        <div class="game-info">Anagrama <i class="fa-solid fa-angle-right"></i></div>
    </button>
    
    <button class="game-card-btn typeanswer-g-btn" onclick="loadContent('typeanswer')">
        <div class="game-icon"><i class="fa-solid fa-keyboard"></i></div>
        <div class="game-info">Type answer <i class="fa-solid fa-angle-right"></i></div>
    </button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const bookCode = urlParams.get('book') || "ess1";
const unitId = urlParams.get('unit') || "1";
const lessonKey = `${bookCode}_${unitId}`;

let currentLang = localStorage.getItem('selectedLang') || 'uz';
if(currentLang === 'en') currentLang = 'uz'; 

const db = (typeof lessonsDatabase !== 'undefined') ? lessonsDatabase : {};
const fallbackLesson = {
    "uz": { "title": "Dars topilmadi", "gamesTitle": "O'YINLAR RO'YXATI", "textHtml": "<p>Baza ulanmagan yoki dars topilmadi.</p>", "keywordsList": [] },
    "ru": { "title": "Урок не найден", "gamesTitle": "СПИСОК ИГР", "textHtml": "<p>База данных не найдена.</p>", "keywordsList": [] }
};
const lessonDataFull = db[lessonKey] || db["ess1_1"] || fallbackLesson;
let currentLessonData = lessonDataFull[currentLang] || lessonDataFull["uz"];

let localGameData = [];
let matchUpGroups = []; 

let currentGameIndex = 0;
let totalGameRounds = 0; 
let gameScore = 0;
let gameTimerInterval = null;
let gameSeconds = 0;
let roundSeconds = 0;
let roundTimerInterval = null;

window.onload = function() {
    injectGameStyles(); // Uslublarni boshida bir marta yuklaymiz
    document.getElementById("langSelect").value = currentLang;
    renderLessonContent();
    loadContent('text');
}

function toggleLessonLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('selectedLang', lang);
    currentLessonData = lessonDataFull[lang] || lessonDataFull["uz"];
    resetAudioPlayer();
    renderLessonContent();
    loadContent('text'); 
}

function renderLessonContent() {
    document.getElementById("lessonTitle").innerText = currentLessonData.title || "Mavzu";
    document.getElementById("gamesTitleText").innerText = currentLessonData.gamesTitle || "GAMELAR RO'YXATI";
}

// 🎵 MP3 MULTIMEDIA AUDIO PLAYER FUNKSIYALARI
function initAudioPlayer() {
    const audio = document.getElementById("mainAudioElement");
    const playerContainer = document.getElementById("floatingAudioPlayer");
    
    if (currentLessonData && currentLessonData.audioUrl) {
        audio.src = currentLessonData.audioUrl;
        audio.load(); // Audioni yuklash majburiy
        playerContainer.style.display = "flex"; 
        document.getElementById("audioSpeedSelect").value = "1";
        audio.playbackRate = 1;
        updatePlayBtnIcon(false);
    } else {
        playerContainer.style.display = "none";
    }
}

function toggleAudioPlay() {
    const audio = document.getElementById("mainAudioElement");
    if (!audio.src) return;
    if (audio.paused) {
        audio.play().catch(e => console.log("Audio ijrosida xato:", e));
        updatePlayBtnIcon(true);
    } else {
        audio.pause();
        updatePlayBtnIcon(false);
    }
}

function updatePlayBtnIcon(isPlaying) {
    const btn = document.getElementById("playerPlayBtn");
    if (btn) {
        btn.innerHTML = isPlaying ? `<i class="fa-solid fa-pause"></i>` : `<i class="fa-solid fa-play"></i>`;
    }
}
