}

// Ovozni tezkor ijro etish uchun ob'ektni xotirada saqlaymiz
let currentAudio = null;

function speakWord(word) {
    if (!word) return;

    let cleanText = word.replace(/[\[\]\(\)\.,\?!;:"']/g, '').trim();
    if (!cleanText) return;

    // Agar avvalgi ovoz hali tugamagan bo'lsa, uni darhol to'xtatamiz
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    // 1-USTUVORLIK: Juda tezkor Youdao CDN audio manbasi (type=2 -> US accent)
    const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(cleanText)}&type=2`;
    
    currentAudio = new Audio(audioUrl);
    
    // Tarmoq sekin bo'lsa kutib o'tirmasdan darhol pley qilish
    let playPromise = currentAudio.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            // Agar audio tarmoq sababli kechiksa, zudlik bilan mahalliy TTS ga o'tish
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        });
    }
}
function playSoundEffect(isCorrect) {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (isCorrect) {
            let osc1 = ctx.createOscillator();
            let gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain1.gain.setValueAtTime(0.3, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start();
            osc1.stop(ctx.currentTime + 0.3);
        } else {
            let osc2 = ctx.createOscillator();
            let gain2 = ctx.createGain();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(120, ctx.currentTime);
            gain2.gain.setValueAtTime(0.2, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start();
            osc2.stop(ctx.currentTime + 0.25);
        }
    } catch (e) {}
}

function startWordwallTimer() {
    clearInterval(gameTimerInterval);
    clearInterval(roundTimerInterval);
    gameSeconds = 0;
    roundSeconds = 0;
    gameTimerInterval = setInterval(() => {
        gameSeconds++;
        const min = Math.floor(gameSeconds / 60);
        const sec = gameSeconds % 60;
        const timerEl = document.getElementById("wwTimer");
        if(timerEl) timerEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }, 1000);
    roundTimerInterval = setInterval(() => { roundSeconds++; }, 1000);
}

function calculateSpeedBonus() {
    let bonus = 20; 
    if (roundSeconds <= 8) bonus = 100;          
    else if (roundSeconds <= 16) bonus = 60;     
    roundSeconds = 0;     
    return bonus;
}

function updateWWStats() {
    const scoreEl = document.getElementById("wwScore");
    const progressEl = document.getElementById("wwProgressText");
    if(scoreEl) scoreEl.innerText = `✓ ${gameScore}`;
    if(progressEl) progressEl.innerText = `${currentGameIndex + 1} of ${totalGameRounds}`;
}

function checkGameOver(type, container) {
    if (currentGameIndex >= totalGameRounds) {
        clearInterval(gameTimerInterval);
        clearInterval(roundTimerInterval);

        if (type === 'flashcard') {
            renderFlashcardResults(container);
            return true;
        }

        if (['anagrama','typeanswer','matchup'].includes(type)) {
            renderGameSessionResults(container, type);
            return true;
        }

        const min = Math.floor(gameSeconds / 60);
        const sec = gameSeconds % 60;
        container.innerHTML = `            
            <div class="ww-result-screen">                
                <div class="ww-result-trophy"><i class="fa-solid fa-trophy"></i></div>                
                <h2 style="margin: 10px 0; color: #2c3e50;">Activity Complete!</h2>                
                <div class="ww-result-stats">                    
                    <div class="ww-stat-row"><span>⏱️ Time:</span> <strong>${min} m ${sec} s</strong></div>                    
                    <div class="ww-stat-row"><span>🎯 Score:</span> <strong>${gameScore}</strong></div>                
                </div>                
                <div class="ww-leaderboard-input-zone" id="leaderboardInputZone">                    
                    <p style="font-size:14px; color:#555; margin-bottom:8px;">Enter your name for the leaderboard:</p>                    
                    <input type="text" id="leaderboardName" class="ww-input-field" placeholder="Your name..." style="width:90%; margin-bottom:10px; display:inline-block;">                    
                    <button class="ww-action-btn" onclick="submitLocalScore('${type}')">Submit</button>                
                </div>                
                <div id="leaderboardDisplay" style="margin-top:20px; width:100%; display:none;">                    
                    <h3 style="font-size:16px; margin-bottom:5px; color:#2c3e50;">🏆 TOP 10 LEADERBOARD</h3>                    
                    <table id="lbTable" style="width:100%; border-collapse:collapse; margin-top:10px; font-size:14px;"></table>                
                </div>                
                <button class="ww-restart-btn" style="margin-top:20px; background:#95a5a6;" onclick="resetAndRestart('${type}')">Start Again <i class="fa-solid fa-arrow-rotate-right"></i></button>            
            </div>`;
        return true;
    }
    return false;
}

function submitLocalScore(type) {
    const nameInp = document.getElementById("leaderboardName").value.trim();
    if(!nameInp) { alert("Please enter your name!"); return; }
    const storageKey = `lb_${lessonKey}_${type}`;
    let scores = JSON.parse(localStorage.getItem(storageKey)) || [];
    scores.push({ name: nameInp, score: gameScore, duration: gameSeconds, date: new Date().getTime() });
    scores.sort((a, b) => b.score - a.score || a.duration - b.duration);
    scores = scores.slice(0, 10);
    localStorage.setItem(storageKey, JSON.stringify(scores));
    document.getElementById("leaderboardInputZone").style.display = "none";
    showLocalLeaderboard(type);
}

function showLocalLeaderboard(type) {
    const storageKey = `lb_${lessonKey}_${type}`;
    const scores = JSON.parse(localStorage.getItem(storageKey)) || [];
    const table = document.getElementById("lbTable");
    table.innerHTML = `<tr style="background:#eee;"><th>№</th><th>Name</th><th>Score</th><th>Time</th></tr>`;
    scores.forEach((row, idx) => {
        const m = Math.floor(row.duration / 60);
        const s = row.duration % 60;
        table.innerHTML += `<tr>            
            <td style="padding:6px; border:1px solid #ddd; text-align:center;">${idx+1}</td>            
            <td style="padding:6px; border:1px solid #ddd; font-weight:bold;">${row.name}</td>            
            <td style="padding:6px; border:1px solid #ddd; font-weight:bold; text-align:center; color:#2ecc71;">${row.score}</td>            
            <td style="padding:6px; border:1px solid #ddd; text-align:center;">${m}:${s<10?'0':''}${s}</td>        
        </tr>`;
    });
    document.getElementById("leaderboardDisplay").style.display = "block";
}

function resetAndRestart(type) {
    if (['anagrama','typeanswer','matchup'].includes(type)) {
        clearInterval(gameRoundTimerInterval);
        gameRoundTimerInterval = null;
        gameSessionStarted = false;
        gameSessionResults = [];
        gameStudentName = "";
        gameAnswerLocked = false;
        gameRetryMode = false;
        gameRetryItems = [];
        gameRetryType = "";
    }
    if (type === 'flashcard') {
        clearInterval(flashcardRoundTimerInterval);
        flashcardRoundTimerInterval = null;
    }
    currentGameIndex = 0;
    gameScore = 0;
    if (['anagrama','typeanswer'].includes(type)) {
        gameRetryMode = false;
        gameRetryItems = [];
        gameRetryType = '';
    }
    if (type === 'flashcard') {
        flashcardStarted = false;
        flashcardResults = [];
        flashcardStudentName = "";
        flashcardRetryMode = false;
        flashcardRetryItems = [];
    }
    loadContent(type);
}

                            </select>
                        </div>
                        <div class="progress-wrapper">
                            <input type="range" id="audioProgress" value="0" min="0" max="100" oninput="seekAudio(this.value)" style="width:100%;">
                        </div>
                    </div>
                </div>`;
        }

        let rawHtml = currentLessonData.textHtml || "<p>No text available.</p>";
        let tempDiv = document.createElement("div");
        tempDiv.innerHTML = rawHtml;

        let walk = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
        let textNodes = [];
        let node;
        while(node = walk.nextNode()) {
            if (node.parentNode.nodeName !== 'SCRIPT' && node.parentNode.nodeName !== 'STYLE') {
                textNodes.push(node);
            }
        }

        textNodes.forEach(tNode => {
            let words = tNode.nodeValue.split(/(\s+)/);
            let fragment = document.createDocumentFragment();
            words.forEach(w => {
                if (w.trim().length > 0 && /[a-zA-Z]/.test(w)) {
                    let span = document.createElement("span");
                    span.className = "clickable-word";
                    span.innerText = w;
                    span.style.cursor = "pointer";
                    span.setAttribute("onclick", `speakWord(this.innerText)`);
                    fragment.appendChild(span);
                } else {
                    fragment.appendChild(document.createTextNode(w));
                }
            });
            tNode.parentNode.replaceChild(fragment, tNode);
        });

        textZone.innerHTML = audioHtml + tempDiv.innerHTML;
        textZone.style.display = "block";
        initAudioPlayerListeners();
    } 
    else if (type === 'keywords') {
        let tableHtml = `<table style="width:100%; border-collapse:collapse; margin-top:10px;">            
            <tr style="background:#3498db; color:white;"><th style="padding:10px;">Word</th><th style="padding:10px;">Translation</th></tr>`;
        localGameData.forEach(item => {
            let escapedWord = item.word.replace(/'/g, "\\'");
            tableHtml += `<tr>                
                <td style="padding:10px; font-weight:bold; cursor:pointer; color:#2c3e50;" onclick="speakWord('${escapedWord}')">                    
                    <i class="fa-solid fa-volume-high" style="color:#3498db; margin-right:5px;"></i> ${item.word}                
                </td>                
                <td style="padding:10px; color:#555;">${item.translation}</td>            
            </tr>`;
        });
        tableHtml += `</table>`;
        textZone.innerHTML = tableHtml;
        textZone.style.display = "block";
    }
    else if (type === 'video' || type === 'test') {
        iframeZone.src = type === 'video' ? (currentLessonData.videoUrl || "") : (currentLessonData.testUrl || "");
        iframeZone.style.display = "block";
    } 
    else {
        textZone.style.display = "block";
        if (localGameData.length === 0) {
            textZone.innerHTML = `<p style="padding:20px; text-align:center; color:#e74c3c;">No game data available!</p>`;
            return;
        }
        
        injectGameStyles();

        textZone.innerHTML = `            
            <div class="ww-game-container">                
                <div class="ww-top-bar">                    
                    <span id="wwTimer">0:00</span>                    
                    <span id="wwScore">✓ 0</span>                
                </div>                
                <div class="ww-play-area" id="wwPlayArea"></div>                
                <div class="ww-bottom-bar">                    
                    <button class="ww-nav-btn" id="wwPrev" onclick="navWWGame(-1, '${type}')"><i class="fa-solid fa-backward-step"></i></button>                    
                    <span class="ww-progress-text" id="wwProgressText"></span>                    
                    <button class="ww-finish-btn" id="wwFinishBtn" onclick="finishCurrentGame('${type}')"><i class="fa-solid fa-flag-checkered"></i> Finish</button>                    
                    <button class="ww-nav-btn" id="wwNext" onclick="navWWGame(1, '${type}')"><i class="fa-solid fa-forward-step"></i></button>                
                </div>            
            </div>`;

        if (['anagrama','typeanswer','matchup'].includes(type)) {
            totalGameRounds = (type === 'matchup') ? Math.ceil(localGameData.length / 5) : localGameData.length;
            if (!(['anagrama','typeanswer'].includes(type) && gameRetryMode && gameRetryType === type)) {
                showGameSessionStartScreen(type);
                return;
            }
        }

        startWordwallTimer();

        if (type === 'anagrama') {
            totalGameRounds = localGameData.length;
            buildAnagramaGame();
        } else if (type === 'typeanswer') {
            totalGameRounds = localGameData.length;
            buildTypeAnswerGame();
        } else if (type === 'matchup') {
            matchUpGroups = [];
            for (let i = 0; i < localGameData.length; i += 5) {
                matchUpGroups.push(localGameData.slice(i, i + 5));
            }
            totalGameRounds = matchUpGroups.length;
            buildMatchUpGame();
        } else if (type === 'flashcard') {
            totalGameRounds = localGameData.length;
            if (flashcardRetryMode && localGameData.length) {
                flashcardStarted = true;
                flashcardResults = [];
                currentGameIndex = 0;
                gameScore = 0;
                startWordwallTimer();
                buildFlashcardGame();
            } else {
                flashcardRetryMode = false;
                flashcardRetryItems = [];
                showFlashcardStartScreen();
            }
            return;
        }
    }
}

// 🔠 1. ANAGRAMA GAME
let anagramTileOrder = [];

function buildAnagramaGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea || !gameSessionStarted) return;
    if (checkGameOver('anagrama', playArea)) return;

    gameAnswerLocked = false;
    let item = localGameData[currentGameIndex];
    let cleanWord = item.word.toUpperCase().replace(/[\[\]]/g, '').trim();
    let lettersArr = cleanWord.split("");
    let shuffled = lettersArr.map((char, index) => ({ char, id: index })).sort(() => Math.random() - 0.5);
    
    anagramTileOrder = []; 

    playArea.innerHTML = `        
        <div class="yf-card-round-timer" id="gameRoundTimer"><i class="fa-regular fa-clock"></i> <span>45</span>s</div>
        <div class="ww-target-title">${item.translation}</div>        
        <div class="ww-slots-row" id="slotsRow"></div>        
        <div class="ww-letters-row" id="lettersRow"></div>        
        <div class="ww-ctrl-container">            
            <button class="ww-backspace-btn" onclick="backspaceAnagramSlot()">                
                <i class="fa-solid fa-delete-left"></i> Delete            
            </button>        
        </div>`;

    updateWWStats();
    document.getElementById("wwPrev").disabled = true;
    document.getElementById("wwNext").disabled = true;
    startGameRoundTimer();

    const slotsRow = document.getElementById("slotsRow");
    const lettersRow = document.getElementById("lettersRow");

    lettersArr.forEach(() => {
        let slot = document.createElement("div");
        slot.className = "ww-slot-box";
        slotsRow.appendChild(slot);
    });

    shuffled.forEach((obj) => {
        let tile = document.createElement("div");
        tile.className = "ww-letter-tile";
        tile.id = `tile-${obj.id}`;
        tile.innerText = obj.char;
        tile.onclick = () => {
            if(tile.classList.contains('used')) return;
            let emptySlot = Array.from(slotsRow.children).find(s => s.innerText === "");
            if(emptySlot) {
                tile.classList.add('used');
                emptySlot.innerText = obj.char;
                emptySlot.classList.add('filled');
                emptySlot.setAttribute("data-tile-id", obj.id);
                anagramTileOrder.push(emptySlot); 
                checkAnagramResult(cleanWord);
            }
        };
        lettersRow.appendChild(tile);
    });
}

function backspaceAnagramSlot() {
    if (gameAnswerLocked || anagramTileOrder.length === 0) return;
    let lastFilledSlot = anagramTileOrder.pop(); 
    if (lastFilledSlot) {
        let tileId = lastFilledSlot.getAttribute("data-tile-id");
        let originalTile = document.getElementById(`tile-${tileId}`);
        if (originalTile) originalTile.classList.remove('used');
        
        lastFilledSlot.innerText = "";
        lastFilledSlot.classList.remove('filled');
        lastFilledSlot.removeAttribute("data-tile-id");
        
        const slotsRow = document.getElementById("slotsRow");
        slotsRow.style.borderColor = "#b2bec3";
    }
}

function checkAnagramResult(cleanWord) {
    if (gameAnswerLocked) return;
    const slotsRow = document.getElementById("slotsRow");
    let currentWord = "";
    let filledCount = 0;

    Array.from(slotsRow.children).forEach(s => {
        if (s.innerText !== "") {
            currentWord += s.innerText;
            filledCount++;
        }
    });

    if(filledCount === cleanWord.length) {
        if(currentWord === cleanWord) {
            gameAnswerLocked = true;
            clearInterval(gameRoundTimerInterval);
            gameRoundTimerInterval = null;
            playSoundEffect(true);
            gameScore += 1;
            recordGameAnswer(localGameData[currentGameIndex], true, false);
            speakWord(cleanWord);
            slotsRow.style.border = "2px solid #2ecc71";
            setTimeout(() => { currentGameIndex++; buildAnagramaGame(); }, 800);
        } else {
            playSoundEffect(false);
            slotsRow.style.border = "2px solid #e74c3c";
        }
    }
}

// ⌨️ 2. TYPE ANSWER GAME
function buildTypeAnswerGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea || !gameSessionStarted) return;
    if (checkGameOver('typeanswer', playArea)) return;

    gameAnswerLocked = false;
    let item = localGameData[currentGameIndex];
    
    playArea.innerHTML = `
        <div class="yf-card-round-timer" id="gameRoundTimer"><i class="fa-regular fa-clock"></i> <span>45</span>s</div>
        <div class="ww-target-title" style="margin-bottom:30px;">${item.translation}</div>
        <div class="ww-type-input-zone">
            <input type="text" id="typeAnswerInput" class="ww-answer-input" placeholder="Type your answer..." autocomplete="off">
            <button class="ww-action-btn" style="width:100%; margin-top:5px;" onclick="checkTypeAnswerResult()">Check</button>
        </div>`;

    updateWWStats();
    document.getElementById("wwPrev").disabled = true;
    document.getElementById("wwNext").disabled = true;
    startGameRoundTimer();

    const inputField = document.getElementById("typeAnswerInput");
    inputField.focus();
    inputField.addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            checkTypeAnswerResult();
        }
    });
}

function checkTypeAnswerResult() {
    if (gameAnswerLocked) return;
    let item = localGameData[currentGameIndex];
    const inputField = document.getElementById("typeAnswerInput");
    if (!inputField) return;

    let userAnswer = inputField.value.trim().toLowerCase();
    let correctAnswer = item.word.toLowerCase().replace(/[\[\]]/g, '').trim();
    if (!userAnswer) return;

    const isCorrect = userAnswer === correctAnswer;
    gameAnswerLocked = true;
    clearInterval(gameRoundTimerInterval);
    gameRoundTimerInterval = null;
    recordGameAnswer(item, isCorrect, false, userAnswer);

    if (isCorrect) {
        playSoundEffect(true);
        gameScore += 1;
        speakWord(item.word);
        inputField.style.borderColor = "#2ecc71";
        inputField.style.background = "#e8f5e9";
    } else {
        playSoundEffect(false);
        inputField.style.borderColor = "#e74c3c";
        inputField.style.background = "#ffebee";
    }
    setTimeout(() => { currentGameIndex++; buildTypeAnswerGame(); }, 700);
}

// 🧩 3. MATCH UP GAME
function buildMatchUpGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea || !gameSessionStarted) return;
    if (checkGameOver('matchup', playArea)) return;

    selectedMatchWord = null;
    selectedMatchTrans = null;

    let currentGroup = matchUpGroups[currentGameIndex];
    if(!currentGroup) return;

    let wordsArr = currentGroup.map(item => item.word).sort(() => Math.random() - 0.5);
    let transArr = currentGroup.map(item => item.translation).sort(() => Math.random() - 0.5);

    let matchupHtml = `
        <div class="ww-target-title" style="margin-bottom:15px;">Match the words with their translations</div>
        <div class="ww-matchup-container">
            <div class="ww-match-column" id="matchWordsCol"></div>
            <div class="ww-match-column" id="matchTransCol"></div>
        </div>`;
        
    playArea.innerHTML = matchupHtml;
    updateWWStats();
    document.getElementById("wwPrev").disabled = true;
    document.getElementById("wwNext").disabled = true;

    const wordsCol = document.getElementById("matchWordsCol");
    const transCol = document.getElementById("matchTransCol");

    wordsArr.forEach(word => {
        let div = document.createElement("div");
        div.className = "ww-match-item";
        div.innerText = word;
        div.setAttribute("data-word", word);
        div.onclick = () => {
            if(div.classList.contains('matched')) return;
            document.querySelectorAll("#matchWordsCol .ww-match-item").forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectedMatchWord = div;
            checkMatchPair();
        };
        wordsCol.appendChild(div);
    });

    transArr.forEach(trans => {
        let div = document.createElement("div");
        div.className = "ww-match-item";
        div.innerText = trans;
        div.setAttribute("data-trans", trans);
        div.onclick = () => {
            if(div.classList.contains('matched')) return;
            document.querySelectorAll("#matchTransCol .ww-match-item").forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectedMatchTrans = div;
            checkMatchPair();
        };
        transCol.appendChild(div);
    });
}

function checkMatchPair() {
    if (!selectedMatchWord || !selectedMatchTrans) return;

    let wordVal = selectedMatchWord.getAttribute("data-word");
    let transVal = selectedMatchTrans.getAttribute("data-trans");

    let currentGroup = matchUpGroups[currentGameIndex];
    let matchFound = currentGroup.some(item => item.word === wordVal && item.translation === transVal);

    if (matchFound) {
        playSoundEffect(true);
        speakWord(wordVal);
        
        selectedMatchWord.classList.remove('selected');
        selectedMatchTrans.classList.remove('selected');
        
        selectedMatchWord.classList.add('matched');
        selectedMatchTrans.classList.add('matched');
        
        selectedMatchWord = null;
        selectedMatchTrans = null;

        const totalItems = document.querySelectorAll(".ww-match-item").length;
        const matchedItems = document.querySelectorAll(".ww-match-item.matched").length;

        if (totalItems === matchedItems) {
            currentGroup.forEach(item => recordGameAnswer(item, true, false));
            gameScore += currentGroup.length;
            setTimeout(() => { currentGameIndex++; buildMatchUpGame(); }, 700);
        }
    } else {
        playSoundEffect(false);
        let wBtn = selectedMatchWord;
        let tBtn = selectedMatchTrans;
        wBtn.style.borderColor = "#e74c3c";
        tBtn.style.borderColor = "#e74c3c";
        
        setTimeout(() => {
            wBtn.classList.remove('selected');
            tBtn.classList.remove('selected');
            wBtn.style.borderColor = "#bdc3c7";
            tBtn.style.borderColor = "#bdc3c7";
        }, 800);

        selectedMatchWord = null;
        selectedMatchTrans = null;
    }
}

// ===== SHARED SESSION SYSTEM FOR ANAGRAM / TYPE ANSWER / MATCH UP =====
function showGameSessionStartScreen(type) {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;
    clearInterval(gameRoundTimerInterval);
    gameRoundTimerInterval = null;
    gameSessionStarted = false;
    gameSessionResults = [];
    gameStudentName = "";
    gameAnswerLocked = false;
    currentGameIndex = 0;
    gameScore = 0;
    gameSeconds = 0;
    roundSeconds = 0;

    const labels = { anagrama: 'Anagram', typeanswer: 'Type Answer', matchup: 'Match Up' };
    const icons = { anagrama: 'fa-shuffle', typeanswer: 'fa-keyboard', matchup: 'fa-puzzle-piece' };
    const timerText = type === 'matchup' ? 'No per-question timer' : '45 seconds for each word';
    const total = type === 'matchup' ? localGameData.length : localGameData.length;
    document.getElementById("wwScore").innerText = "✓ 0";
    document.getElementById("wwProgressText").innerText = `0 of ${total}`;
    document.getElementById("wwTimer").innerText = "0:00";

    playArea.innerHTML = `
        <div class="yf-start-screen">
            <div class="yf-start-icon"><i class="fa-solid ${icons[type]}"></i></div>
            <h2>${labels[type]}</h2>
            <p>Enter your name before starting.</p>
            <input type="text" id="gameStudentInput" class="yf-name-input" placeholder="Name and surname" autocomplete="name">
            <div class="yf-session-hint"><i class="fa-regular fa-clock"></i> ${timerText}</div>
            <button class="yf-start-btn" onclick="startGameSession('${type}')">
                <i class="fa-solid fa-play"></i> Start ${labels[type]}
            </button>
        </div>`;
    const input = document.getElementById("gameStudentInput");
    if (input) {
        input.focus();
        input.addEventListener('keydown', e => { if (e.key === 'Enter') startGameSession(type); });
    }
    const prevBtn = document.getElementById("wwPrev");
    const nextBtn = document.getElementById("wwNext");
    const finishBtn = document.getElementById("wwFinishBtn");
    if (prevBtn) prevBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = true;
    if (finishBtn) finishBtn.disabled = true;
}

function startGameSession(type) {
    const input = document.getElementById("gameStudentInput");
    const name = input ? input.value.trim() : '';
    if (!name) {
        if (input) { input.classList.add('yf-input-error'); input.focus(); }
        return;
    }
    gameStudentName = name;
    gameSessionStarted = true;
    gameSessionResults = [];
    currentGameIndex = 0;
    gameScore = 0;
    gameAnswerLocked = false;

    // Randomize the vocabulary order for every new session.
    localGameData = [...localGameData].sort(() => Math.random() - 0.5);

    // Match Up uses groups of 5 words. Rebuild the groups when the
    // session actually starts (the previous version only created them
    // inside loadContent, before the start screen was shown).
    if (type === 'matchup') {
        matchUpGroups = [];
        for (let i = 0; i < localGameData.length; i += 5) {
            matchUpGroups.push(localGameData.slice(i, i + 5));
        }
        totalGameRounds = matchUpGroups.length;
    } else {
        totalGameRounds = localGameData.length;
    }

    startWordwallTimer();
    if (type === 'anagrama') buildAnagramaGame();
    else if (type === 'typeanswer') buildTypeAnswerGame();
    else if (type === 'matchup') buildMatchUpGame();
}

function startGameRoundTimer() {
    clearInterval(gameRoundTimerInterval);
    gameSecondsLeft = 45;
    const playArea = document.getElementById('wwPlayArea');
    const timerBox = document.getElementById('gameRoundTimer');
    if (timerBox) timerBox.innerHTML = '<i class="fa-regular fa-clock"></i> <span>45</span>s';
    gameRoundTimerInterval = setInterval(() => {
        gameSecondsLeft--;
        const el = document.getElementById('gameRoundTimer');
        if (el) {
            el.querySelector('span').textContent = gameSecondsLeft;
            if (gameSecondsLeft <= 10) el.classList.add('yf-round-danger');
        }
        if (gameSecondsLeft <= 0) {
            clearInterval(gameRoundTimerInterval);
            gameRoundTimerInterval = null;
            handleGameRoundTimeout();
        }
    }, 1000);
}

function handleGameRoundTimeout() {
    if (!gameSessionStarted || gameAnswerLocked) return;
    gameAnswerLocked = true;
    const type = document.getElementById('typeAnswerInput') ? 'typeanswer' : 'anagrama';
    const item = localGameData[currentGameIndex];
    recordGameAnswer(item, false, true);
    playSoundEffect(false);
    if (type === 'typeanswer') {
        const input = document.getElementById('typeAnswerInput');
        if (input) { input.disabled = true; input.style.borderColor = '#e74c3c'; input.style.background = '#ffebee'; }
        setTimeout(() => { currentGameIndex++; buildTypeAnswerGame(); }, 500);
    } else {
        const slots = document.getElementById('slotsRow');
        if (slots) slots.style.border = '2px solid #e74c3c';
        setTimeout(() => { currentGameIndex++; buildAnagramaGame(); }, 500);
    }
}

function recordGameAnswer(item, correct, timedOut = false, userAnswer = '') {
    if (!item) return;
    const idx = gameSessionResults.findIndex(r => r && r.index === currentGameIndex && r.word === item.word);
    const row = { index: currentGameIndex, word: item.word, translation: item.translation, correct: !!correct, timedOut: !!timedOut, userAnswer: userAnswer || '' };
    if (idx >= 0) gameSessionResults[idx] = row;
    else gameSessionResults.push(row);
}

function saveGameSessionScore(type) {
    const key = `lb_${lessonKey}_${type}`;
    const total = localGameData.length;
    const correct = gameSessionResults.filter(r => r && r.correct).length;
    const percent = total ? Math.round(correct / total * 100) : 0;
    const result = { name: gameStudentName, score: correct, correct, total, percent, duration: gameSeconds, details: gameSessionResults.map(r => r ? ({...r}) : ({correct:false, unanswered:true})), date: Date.now() };
    let scores = JSON.parse(localStorage.getItem(key)) || [];
    scores.push(result);
    scores.sort((a,b) => (b.score-a.score) || (b.percent-a.percent) || (a.duration-b.duration) || (a.date-b.date));
    scores = scores.slice(0, 1000);
    localStorage.setItem(key, JSON.stringify(scores));
    return { result, scores, rank: scores.findIndex(r => r.date === result.date) + 1 };
}

function renderGameSessionResults(container, type) {
    clearInterval(gameRoundTimerInterval);
    gameRoundTimerInterval = null;
    const saved = saveGameSessionScore(type);
    const result = saved.result;
    const rank = saved.rank;
    const min = Math.floor(result.duration / 60), sec = result.duration % 60;
    const rows = saved.scores.slice(0,10).map((r,i) => {
        const m = Math.floor(r.duration/60), s = r.duration%60;
        return `<tr class="${r.date===result.date?'yf-current-rank':''}"><td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${r.percent}%</td><td>${m}:${s<10?'0':''}${s}</td></tr>`;
    }).join('');
    container.innerHTML = `
      <div class="ww-result-screen yf-result-screen">
        <div class="ww-result-trophy"><i class="fa-solid fa-trophy"></i></div>
        <h2>Activity Complete!</h2>
        <p class="yf-result-user">${escapeHtml(result.name)}</p>
        <div class="ww-result-stats yf-result-stats">
          <div class="ww-stat-row"><span>⏱️ Time:</span><strong>${min} m ${sec} s</strong></div>
          <div class="ww-stat-row"><span>🎯 Correct:</span><strong>${result.correct} / ${result.total}</strong></div>
          <div class="ww-stat-row"><span>📊 Accuracy:</span><strong>${result.percent}%</strong></div>
          <div class="ww-stat-row"><span>🏆 Rank:</span><strong>#${rank}</strong></div>
        </div>
        <div class="yf-result-actions">
          <button class="yf-details-btn" onclick="toggleGameDetails('${type}')"><i class="fa-solid fa-list-check"></i> Details</button>
          ${['anagrama','typeanswer'].includes(type) && result.details.some(r => r && !r.correct) ? `
          <button class="yf-retry-btn" onclick="retryGameMistakes('${type}')">
            <i class="fa-solid fa-rotate-right"></i> Practice Mistakes
          </button>` : ''}
        </div>
        <div id="yfGameDetails" class="yf-details-panel" style="display:none;">
          <h3>Answer Details</h3>
          <div class="yf-detail-list">
          ${result.details.map((r,i)=>`<div class="yf-detail-item ${r.correct?'yf-detail-correct':'yf-detail-wrong'}">
            <div class="yf-detail-icon">${r.correct?'✓':'✕'}</div>
            <div class="yf-detail-word"><strong>${i+1}. ${escapeHtml(r.word||'')}</strong><span>${escapeHtml(r.translation||'')}</span>${r.userAnswer?`<small>Your answer: ${escapeHtml(r.userAnswer)}</small>`:''}</div>
            <div class="yf-detail-status">${r.correct?'Correct':(r.timedOut?'Time up':(r.unanswered?'Not answered':'Wrong'))}</div>
          </div>`).join('')}
          </div>
        </div>
        <div class="yf-leaderboard-block"><h3>🏆 TOP 10 LEADERBOARD</h3><table class="yf-leaderboard-table"><thead><tr><th>№</th><th>Name</th><th>Accuracy</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>
        <button class="ww-restart-btn yf-restart-btn" onclick="resetAndRestart('${type}')">Start Again <i class="fa-solid fa-arrow-rotate-right"></i></button>
      </div>`;
}

function retryGameMistakes(type) {
    if (!['anagrama','typeanswer'].includes(type)) return;

    const mistakes = gameSessionResults
        .filter(r => r && !r.correct)
        .map(r => ({ word: r.word, translation: r.translation }));

    if (!mistakes.length) return;

    gameRetryMode = true;
    gameRetryType = type;
    gameRetryItems = mistakes.sort(() => Math.random() - 0.5);
    localGameData = gameRetryItems.map(item => ({...item}));
    totalGameRounds = localGameData.length;
    currentGameIndex = 0;
    gameScore = 0;
    gameSessionResults = [];
    gameAnswerLocked = false;
    gameSessionStarted = true;
    clearInterval(gameRoundTimerInterval);
    gameRoundTimerInterval = null;
    startWordwallTimer();

    const textZone = document.getElementById('textContainer');
    const iframeZone = document.getElementById('iframeViewer');
    if (textZone) textZone.style.display = 'block';
    if (iframeZone) iframeZone.style.display = 'none';

    const playArea = document.getElementById('wwPlayArea');
    if (playArea) {
        playArea.innerHTML = '';
        if (type === 'anagrama') buildAnagramaGame();
        else buildTypeAnswerGame();
    }
}

function finishCurrentGame(type) {
    // Allow the learner to end the activity early and immediately see the result.
    if (type === 'flashcard') {
        if (!flashcardStarted) return;
        clearInterval(flashcardRoundTimerInterval);
        flashcardRoundTimerInterval = null;
        // Mark every unanswered card as unanswered/wrong so partial completion is reflected in the score.
        for (let i = 0; i < localGameData.length; i++) {
            if (!flashcardResults[i]) {
                flashcardResults[i] = {
                    word: localGameData[i].word,
                    translation: localGameData[i].translation,
                    correct: false,
                    unanswered: true,
                    timedOut: false
                };
            }
        }
        flashcardStarted = false;
        clearInterval(gameTimerInterval);
        
        const playArea = document.getElementById('wwPlayArea');
        if (playArea) renderFlashcardResults(playArea);
        return;
    }

    if (!gameSessionStarted) return;
    clearInterval(gameRoundTimerInterval);
    gameRoundTimerInterval = null;
    // Mark unanswered words as unanswered so Details can show exactly what was not attempted.
    for (let i = 0; i < localGameData.length; i++) {
        if (!gameSessionResults.some(r => r && r.index === i)) {
            gameSessionResults.push({
                index: i,
                word: localGameData[i].word,
                translation: localGameData[i].translation,
                correct: false,
                unanswered: true,
                timedOut: false,
                userAnswer: ''
            });
        }
    }
    gameSessionStarted = false;
    clearInterval(gameTimerInterval);
    const playArea = document.getElementById('wwPlayArea');
    if (playArea) renderGameSessionResults(playArea, type);
}

function toggleGameDetails(type) {
    const panel = document.getElementById('yfGameDetails');
    const btn = document.querySelector('.yf-details-btn');
    if (!panel || !btn) return;
    const hidden = panel.style.display === 'none';
    panel.style.display = hidden ? 'block' : 'none';
    btn.innerHTML = hidden ? '<i class="fa-solid fa-eye-slash"></i> Hide Details' : '<i class="fa-solid fa-list-check"></i> Details';
}

// 🎴 4. FLASHCARD GAME — YAKKA.TXT USLUBI + SESSION RESULTS
function showFlashcardStartScreen() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea) return;

    clearInterval(gameTimerInterval);
    clearInterval(roundTimerInterval);
    clearInterval(flashcardRoundTimerInterval);
    flashcardRoundTimerInterval = null;
    flashcardStarted = false;
    flashcardResults = [];
    currentGameIndex = 0;
    gameScore = 0;
    gameSeconds = 0;
    roundSeconds = 0;

    const scoreEl = document.getElementById("wwScore");
    const progressEl = document.getElementById("wwProgressText");
    const timerEl = document.getElementById("wwTimer");
    if (scoreEl) scoreEl.innerText = "✓ 0";
    if (progressEl) progressEl.innerText = `0 of ${totalGameRounds}`;
    if (timerEl) timerEl.innerText = "0:00";

    playArea.innerHTML = `
        <div class="yf-start-screen">
            <div class="yf-start-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h2>Flashcard</h2>
            <p>Enter your name before starting.</p>
            <input type="text" id="flashcardStudentInput" class="yf-name-input" placeholder="Name and surname" autocomplete="name">
            <button class="yf-start-btn" onclick="startFlashcardGame()">
                <i class="fa-solid fa-play"></i> Start Flashcard
            </button>
        </div>
    `;

    const input = document.getElementById("flashcardStudentInput");
    if (input) {
        input.focus();
        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") startFlashcardGame();
        });
    }

    const prevBtn = document.getElementById("wwPrev");
    const nextBtn = document.getElementById("wwNext");
    const finishBtn = document.getElementById("wwFinishBtn");
    if (prevBtn) prevBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = true;
    if (finishBtn) finishBtn.disabled = true;
}

function startFlashcardGame() {
    const input = document.getElementById("flashcardStudentInput");
    const name = input ? input.value.trim() : "";
    if (!name) {
        if (input) {
            input.classList.add("yf-input-error");
            input.focus();
        }
        return;
    }

    flashcardStudentName = name;
    flashcardStarted = true;
    flashcardResults = [];
    currentGameIndex = 0;
    gameScore = 0;
    localGameData = [...localGameData].sort(() => Math.random() - 0.5);
    startWordwallTimer();
    buildFlashcardGame();
}

function buildFlashcardGame() {
    const playArea = document.getElementById("wwPlayArea");
    if (!playArea || !flashcardStarted) return;
    if (checkGameOver('flashcard', playArea)) return;

    const item = localGameData[currentGameIndex];
    if (!item) return;

    const escapedWord = item.word.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

    clearInterval(flashcardRoundTimerInterval);
    flashcardRoundTimerInterval = null;
    flashcardSecondsLeft = 15;
    flashcardAnswerLocked = false;

    playArea.innerHTML = `
        <div class="yf-flashcard-section">
            <div class="yf-card-round-timer" id="yfCardRoundTimer"><i class="fa-regular fa-clock"></i> <span>15</span>s</div>
            <div class="yf-flashcard-box" id="yfFlashcard" onclick="flipTrainingFlashcard()">
                <div class="yf-flashcard-inner">
                    <div class="yf-flashcard-face yf-flashcard-front">
                        <span class="yf-word">${item.word}</span>
                    </div>
                    <div class="yf-flashcard-face yf-flashcard-back">
                        <span class="yf-translation">${item.translation}</span>
                    </div>
                </div>
            </div>

            <div class="yf-eval-buttons">
                <button class="yf-btn yf-btn-known" onclick="event.stopPropagation(); handleFlashcardResult(true)">
                    <span>✓</span> I Know (+1)
                </button>
                <button class="yf-btn yf-btn-unknown" onclick="event.stopPropagation(); handleFlashcardResult(false)">
                    <span>✕</span> I Don't Know
                </button>
            </div>

            <button class="yf-repeat-btn" onclick="event.stopPropagation(); speakCurrentFlashcardWord('${escapedWord}')">
                <i class="fa-solid fa-volume-high"></i> Listen Again
            </button>
        </div>
    `;

    updateWWStats();
    setTimeout(() => speakCurrentFlashcardWord(item.word), 200);
    startFlashcardRoundTimer();

    const prevBtn = document.getElementById("wwPrev");
    const nextBtn = document.getElementById("wwNext");
    if (prevBtn) prevBtn.disabled = currentGameIndex === 0;
    if (nextBtn) nextBtn.disabled = true;
}

function flipTrainingFlashcard() {
    if (flashcardAnswerLocked) return;
    const card = document.getElementById("yfFlashcard");
    if (card) card.classList.toggle("flipped");
}

function startFlashcardRoundTimer() {
    clearInterval(flashcardRoundTimerInterval);
    flashcardSecondsLeft = 15;
    const timerEl = document.getElementById("yfCardRoundTimer");
    if (timerEl) {
        timerEl.classList.remove("yf-round-danger");
        timerEl.innerHTML = '<i class="fa-regular fa-clock"></i> <span>15</span>s';
    }

    flashcardRoundTimerInterval = setInterval(() => {
        flashcardSecondsLeft--;
        const el = document.getElementById("yfCardRoundTimer");
        if (el) {
            el.querySelector("span").textContent = flashcardSecondsLeft;
            if (flashcardSecondsLeft <= 5) el.classList.add("yf-round-danger");
        }

        if (flashcardSecondsLeft <= 0) {
            clearInterval(flashcardRoundTimerInterval);
            flashcardRoundTimerInterval = null;
            handleFlashcardResult(false, true);
        }
    }, 1000);
}

function speakCurrentFlashcardWord(word) {
    if (!word) return;
    speakWord(word);
}

function handleFlashcardResult(isCorrect, timedOut = false) {
    if (!flashcardStarted || currentGameIndex >= totalGameRounds || flashcardAnswerLocked) return;

    flashcardAnswerLocked = true;
    clearInterval(flashcardRoundTimerInterval);
    flashcardRoundTimerInterval = null;

    const idx = currentGameIndex;
    const item = localGameData[idx];
    const previous = flashcardResults[idx];

    if (previous) {
        if (previous.correct !== isCorrect) {
            gameScore += isCorrect ? 1 : -1;
        }
    } else {
        if (isCorrect) gameScore += 1;
    }

    flashcardResults[idx] = {
        word: item.word,
        translation: item.translation,
        correct: isCorrect,
        timedOut: timedOut
    };

    if (typeof playSoundEffect === 'function') playSoundEffect(isCorrect);

    currentGameIndex++;
    buildFlashcardGame();
}

function getFlashcardScoreList() {
    const storageKey = `lb_${lessonKey}_flashcard`;
    return JSON.parse(localStorage.getItem(storageKey)) || [];
}

function saveFlashcardScore() {
    const storageKey = `lb_${lessonKey}_flashcard`;
    const total = totalGameRounds || localGameData.length;
    const correct = flashcardResults.filter(r => r && r.correct).length;
    const percent = total ? Math.round((correct / total) * 100) : 0;
    const result = {
        name: flashcardStudentName,
        score: correct,
        correct: correct,
        total: total,
        percent: percent,
        duration: gameSeconds,
        details: flashcardResults.map(r => r ? ({...r}) : ({correct:false, unanswered:true})),
        retryMode: flashcardRetryMode,
        date: Date.now()
    };

    let scores = getFlashcardScoreList();
    scores.push(result);
    scores.sort((a,b) => (b.score - a.score) || (b.percent - a.percent) || (a.duration - b.duration) || (a.date - b.date));
    // Keep enough history to calculate a meaningful rank, while avoiding unlimited localStorage growth.
    scores = scores.slice(0, 1000);
    localStorage.setItem(storageKey, JSON.stringify(scores));

    return { result, scores, rank: scores.findIndex(x => x.date === result.date) + 1 };
}

function renderFlashcardResults(container) {
    const min = Math.floor(gameSeconds / 60);
    const sec = gameSeconds % 60;
    const saved = saveFlashcardScore();
    const result = saved.result;
    const rank = saved.rank;
    const top10 = saved.scores.slice(0, 10);

    let rows = top10.map((row, idx) => {
        const m = Math.floor(row.duration / 60);
        const s = row.duration % 60;
        const isCurrent = row.date === result.date;
        return `<tr class="${isCurrent ? 'yf-current-rank' : ''}">
            <td>${idx + 1}</td>
            <td>${escapeHtml(row.name)}</td>
            <td>${row.percent}%</td>
            <td>${m}:${s < 10 ? '0' : ''}${s}</td>
        </tr>`;
    }).join('');

    if (rank > 10) {
        rows += `<tr class="yf-current-rank yf-your-row">
            <td>${rank}</td><td>${escapeHtml(result.name)} (You)</td><td>${result.percent}%</td><td>${min}:${sec < 10 ? '0' : ''}${sec}</td>
        </tr>`;
    }

    container.innerHTML = `
        <div class="ww-result-screen yf-result-screen">
            <div class="ww-result-trophy"><i class="fa-solid fa-trophy"></i></div>
            <h2>Activity Complete!</h2>
            <p class="yf-result-user">${escapeHtml(result.name)}</p>

            <div class="ww-result-stats yf-result-stats">
                <div class="ww-stat-row"><span>⏱️ Time:</span><strong>${min} m ${sec} s</strong></div>
                <div class="ww-stat-row"><span>🎯 Correct:</span><strong>${result.correct} / ${result.total}</strong></div>
                <div class="ww-stat-row"><span>📊 Accuracy:</span><strong>${result.percent}%</strong></div>
                <div class="ww-stat-row"><span>🏆 Rank:</span><strong>#${rank}</strong></div>
            </div>

            <div class="yf-result-actions">
                <button class="yf-details-btn" onclick="toggleFlashcardDetails()">
                    <i class="fa-solid fa-list-check"></i> Details
                </button>
                ${result.details.some(r => r && !r.correct) ? `
                <button class="yf-retry-btn" onclick="retryFlashcardMistakes()">
                    <i class="fa-solid fa-rotate-right"></i> Practice Mistakes
                </button>` : ''}
            </div>

            <div id="yfFlashcardDetails" class="yf-details-panel" style="display:none;">
                <h3>Answer Details</h3>
                <div class="yf-detail-list">
                    ${result.details.map((r, i) => `
                        <div class="yf-detail-item ${r.correct ? 'yf-detail-correct' : 'yf-detail-wrong'}">
                            <div class="yf-detail-icon">${r.correct ? '✓' : '✕'}</div>
                            <div class="yf-detail-word"><strong>${i + 1}. ${escapeHtml(r.word || localGameData[i]?.word || '')}</strong><span>${escapeHtml(r.translation || localGameData[i]?.translation || '')}</span></div>
                            <div class="yf-detail-status">${r.correct ? 'Correct' : (r.timedOut ? 'Time up' : (r.unanswered ? 'Not answered' : 'Wrong'))}</div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="yf-leaderboard-block">
                <h3>🏆 TOP 10 LEADERBOARD</h3>
                <table class="yf-leaderboard-table">
                    <thead><tr><th>№</th><th>Name</th><th>Accuracy</th><th>Time</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>

            <button class="ww-restart-btn yf-restart-btn" onclick="resetAndRestart('flashcard')">
                Start Again <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>
        </div>`;
}

function retryFlashcardMistakes() {
    const mistakes = flashcardResults
        .map((r, i) => (r && !r.correct) ? localGameData[i] : null)
        .filter(Boolean)
        .map(item => ({...item}));

    if (!mistakes.length) return;

    flashcardRetryItems = mistakes;
    flashcardRetryMode = true;
    flashcardStarted = true;
    flashcardResults = [];
    currentGameIndex = 0;
    gameScore = 0;
    clearInterval(flashcardRoundTimerInterval);
    flashcardRoundTimerInterval = null;
    startWordwallTimer();
    totalGameRounds = flashcardRetryItems.length;

    const textZone = document.getElementById("textContainer");
    if (textZone) textZone.style.display = "block";
    const iframeZone = document.getElementById("iframeViewer");
    if (iframeZone) iframeZone.style.display = "none";

    localGameData = flashcardRetryItems.map(item => ({...item}));
    const playArea = document.getElementById("wwPlayArea");
    if (playArea) buildFlashcardGame();
}

function toggleFlashcardDetails() {
    const panel = document.getElementById("yfFlashcardDetails");
    const btn = document.querySelector(".yf-details-btn");
    if (!panel || !btn) return;
    const hidden = panel.style.display === "none";
    panel.style.display = hidden ? "block" : "none";
    btn.innerHTML = hidden ? '<i class="fa-solid fa-eye-slash"></i> Hide Details' : '<i class="fa-solid fa-list-check"></i> Details';
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function toggleAudio() {
    const audio = document.getElementById("lessonAudio");
    const btnIcon = document.getElementById("playPauseBtn").querySelector("i");
    if (!audio) return;
    if (audio.paused) {
        audio.play();
        btnIcon.className = "fa-solid fa-pause";
    } else {
        audio.pause();
        btnIcon.className = "fa-solid fa-play";
    }
}

function rewindAudio(seconds) {
    const audio = document.getElementById("lessonAudio");
    if (audio) audio.currentTime += seconds;
}

function navWWGame(dir, type) {
    currentGameIndex += dir;
    if(currentGameIndex < 0) currentGameIndex = 0;
    if(currentGameIndex >= totalGameRounds) currentGameIndex = totalGameRounds - 1;
    loadContent(type);
}

function changeAudioSpeed(speed) {
    const audio = document.getElementById("lessonAudio");
    if (audio) audio.playbackRate = parseFloat(speed);
}

function seekAudio(value) {
    const audio = document.getElementById("lessonAudio");
    if (audio && audio.duration) {
        const seekTo = audio.duration * (value / 100);
        audio.currentTime = seekTo;
    }
}

function initAudioPlayerListeners() {
    const audio = document.getElementById("lessonAudio");
    const progressBar = document.getElementById("audioProgress");
    if(!audio || !progressBar) return;

    audio.addEventListener("timeupdate", () => {
        if(audio.duration) {
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressBar.value = percentage;
        }
    });

    audio.addEventListener("ended", () => {
        const btnIcon = document.getElementById("playPauseBtn").querySelector("i");
        if(btnIcon) btnIcon.className = "fa-solid fa-play";
        progressBar.value = 0;
    });
}

let isFull = false;
function toggleFullscreen() {
    const windowEl = document.getElementById("displayWindow");
    const topBar = document.querySelector(".top-materials-bar");
    const divider = document.getElementById("gamesDivider");
    const grid = document.getElementById("gamesGrid");
    const btnIcon = document.getElementById("resizeBtn").querySelector("i");

    if (!isFull) {
        if(topBar) topBar.style.display = "none";
        if(divider) divider.style.display = "none";
        if(grid) grid.style.display = "none";
        windowEl.classList.add("fullscreen-active");
        btnIcon.className = "fa-solid fa-compress";
        isFull = true;
    } else {
        if(topBar) topBar.style.display = "flex";
        if(divider) divider.style.display = "flex";
        if(grid) grid.style.display = "grid";
        windowEl.classList.remove("fullscreen-active");
        btnIcon.className = "fa-solid fa-expand";
        isFull = false;
    }
}
</script>
