<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Books</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .books-slider { display:flex; gap:20px; overflow-x:auto; scroll-behavior:smooth; padding:15px 10px 25px; scrollbar-width:none; }
    .books-slider::-webkit-scrollbar { display:none; }
    .book-card { min-width:280px; flex:0 0 280px; }
    .book-img { object-fit:cover; }
    .book-btn { background:#229ED9; }
    .book-btn.secondary { background:#5e257c; margin-top:8px; }
    .book-card .book-title { min-height:42px; }
    .books-section { margin-bottom:24px; }
    .books-section h2 { text-align:center; margin:18px 0 8px; }
  </style>
</head>
<body>

<div class="hero-wrapper">
  <div class="slider-container">
    <div class="slide">
      <h1>English Books</h1>
      <p>Kitobni tanlang va o'rganishni boshlang.</p>
    </div>
  </div>
</div>

<div class="user-badge">📚 Kitoblar</div>

<div class="books-section">
  <h2 class="section-title">Guess What!</h2>
  <div class="carousel-wrapper">
    <button class="nav-btn prev" onclick="scrollBooks('guess',-1)">&#10094;</button>
    <div class="books-slider" id="guess"></div>
    <button class="nav-btn next" onclick="scrollBooks('guess',1)">&#10095;</button>
  </div>
</div>

<div class="books-section">
  <h2 class="section-title">Prepare</h2>
  <div class="carousel-wrapper">
    <button class="nav-btn prev" onclick="scrollBooks('prepare',-1)">&#10094;</button>
    <div class="books-slider" id="prepare"></div>
    <button class="nav-btn next" onclick="scrollBooks('prepare',1)">&#10095;</button>
  </div>
</div>

<div class="books-section">
  <h2 class="section-title">500 Words</h2>
  <div class="carousel-wrapper">
    <button class="nav-btn prev" onclick="scrollBooks('words500',-1)">&#10094;</button>
    <div class="books-slider" id="words500"></div>
    <button class="nav-btn next" onclick="scrollBooks('words500',1)">&#10095;</button>
  </div>
</div>

<script>
const booksData = {
  guess: [
    {id:"gue1", title:"Guess What! 1", image:"gue1.jpg"},
    {id:"gue2", title:"Guess What! 2", image:"gue2.jpg"},
    {id:"gue3", title:"Guess What! 3", image:"gue3.jpg"},
    {id:"gue4", title:"Guess What! 4", image:"gue4.jpg"},
    {id:"gue5", title:"Guess What! 5", image:"gue5.jpg"},
    {id:"gue6", title:"Guess What! 6", image:"gue6.jpg"}
  ],
  prepare: [
    {id:"prep7", title:"Prepare 7", image:"prep7.jpg"},
    {id:"prep8", title:"Prepare 8", image:"prep8.jpg"},
    {id:"prep9", title:"Prepare 9", image:"prep9.jpg"},
    {id:"prep10", title:"Prepare 10", image:"prep10.jpg"},
    {id:"prep11", title:"Prepare 11", image:"prep11.jpg"}
  ],
  words500: [
    {id:"sta", title:"Starter 500 Words", image:"sta.jpg"},
    {id:"beg", title:"Beginner 500 Words", image:"beg.jpg"},
    {id:"el", title:"Elementary 500 Words", image:"el.jpg"}
  ]
};

function renderBooks(sectionId, books) {
  const container = document.getElementById(sectionId);
  container.innerHTML = "";
  books.forEach(book => {
    const card = document.createElement("div");
    card.className = "book-card";
    card.innerHTML = `
      <img class="book-img" src="${book.image}" alt="${book.title}"
           onerror="this.style.opacity='.25'">
      <div class="book-title">${book.title}</div>
      <a class="book-btn" href="chapters.html?book=${book.id}">
        <i class="fa-solid fa-book-open"></i> Chapters
      </a>
    `;
    container.appendChild(card);
  });
}

function scrollBooks(id, direction) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollBy({left: direction * 320, behavior:"smooth"});
}

document.addEventListener("DOMContentLoaded", () => {
  renderBooks("guess", booksData.guess);
  renderBooks("prepare", booksData.prepare);
  renderBooks("words500", booksData.words500);
});
</script>
</body>
</html>
